<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A1524">
<title>Choisis ton module</title>
<meta name="description" content="Entraîne-toi pas à pas : choisis ton module d'entraînement.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* Retours de paiement et liens e-mail (confirmation, mot de passe) : ils arrivaient à la racine avant le déplacement de Trade dans /trade/, on les y renvoie avec leurs paramètres */
(function(){var s=location.search,h=location.hash;if(s||(h&&h.length>1)){location.replace("trade/"+s+h)}})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#ECF1F6;--card:#fff;--ink:#0E2342;--mute:#566780;--line:#CDD7E3;--acc:#16396E;--onacc:#fff;--accbg:rgba(22,57,110,.10);--up:#12906a;--dn:#d3443c;
 --f-head:"Bricolage Grotesque","Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0A1524;--card:#112239;--ink:#E8EEF6;--mute:#9AABC0;--line:#243852;--acc:#F2C23A;--onacc:#0A1524;--accbg:rgba(242,194,58,.14);--up:#2fcf9b;--dn:#ff6e66}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);background-size:clamp(420px,58vw,640px) auto;background-repeat:repeat;color:var(--ink);font:16px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 .75rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
h1{font:800 clamp(1.7rem,5vw,2.4rem)/1.1 var(--f-head);margin:0 0 10px;text-wrap:balance}
.lead{margin:0 0 28px;color:var(--mute);max-width:46ch;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none}
.card h2{font:700 1.25rem/1.2 var(--f-head);margin:0}
.card p{margin:0;color:var(--mute);font-size:.95rem}
.pic{height:190px;border-radius:12px;background:var(--accbg);display:flex;align-items:flex-end;justify-content:center;padding:10px 10px 0;overflow:hidden}
.pic svg{height:100%;width:auto;max-width:100%;display:block}
.tag{align-self:flex-start;font:600 .72rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px}
.tag.on{background:var(--accbg);color:var(--acc)}
.tag.soon{border:1px solid var(--line);color:var(--mute)}
a.card.live{border:1.5px solid var(--acc);transition:transform .15s,box-shadow .15s}
a.card.live:hover,a.card.live:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.14);outline:none}
a.card.live:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.go{margin-top:auto;padding-top:6px;font-weight:600;color:var(--acc)}
.card.soon h2{color:var(--mute)}
.card.soon .pic svg{opacity:.85}
.note{margin:26px 0 0;font-size:.85rem;color:var(--mute);max-width:60ch}
@media (prefers-reduced-motion:reduce){a.card.live{transition:none}a.card.live:hover{transform:none}}
</style></head>
<body>
<div class="wrap">
 <p class="eyebrow" id="eyebrow"></p>
 <h1 id="h1"></h1>
 <p class="lead" id="lead"></p>
 <div class="grid">
  <a class="card live" href="trade/">
   <div class="pic" id="pic-trade" role="img"></div>
   <span class="tag on" id="t-on"></span>
   <h2>Trade</h2>
   <p id="d-trade"></p>
   <span class="go" id="go"></span>
  </a>
  <div class="card soon" aria-disabled="true">
   <div class="pic" id="pic-doc" role="img"></div>
   <span class="tag soon" id="t-doc"></span>
   <h2>Doc</h2>
   <p id="d-doc"></p>
  </div>
  <div class="card soon" aria-disabled="true">
   <div class="pic" id="pic-stu" role="img"></div>
   <span class="tag soon" id="t-stu"></span>
   <h2>Student</h2>
   <p id="d-stu"></p>
  </div>
 </div>
 <p class="note" id="note"></p>
</div>
<script>
/* Aros, le chat tuxedo en coiffe bigoudène : même dessin que dans l'application (expression neutre), avec une tenue par module.
   Tenues : trade = cravate rouge + broche en bougies ; doc = blouse blanche, stéthoscope, miroir frontal (sans coiffe) ; student = toque de diplômé + lunettes rondes (sans coiffe). */
function arosSvg(outfit,vb,at){
 var ey="#F7D43A",eb="#C79A10";
 function eye(cx){return '<ellipse cx="'+cx+'" cy="130" rx="12" ry="13" fill="'+ey+'" stroke="'+eb+'" stroke-width="1.6"/><path d="M'+(cx-11)+' 134Q'+cx+' 150 '+(cx+11)+' 134Q'+cx+' 141 '+(cx-11)+' 134Z" fill="#FBEA8C"/><path d="M'+(cx-10)+' 124Q'+cx+' 116 '+(cx+10)+' 124Q'+cx+' 120 '+(cx-10)+' 124Z" fill="'+eb+'"/><ellipse cx="'+cx+'" cy="130" rx="3.6" ry="9.2" fill="#10151F"/><circle cx="'+(cx-4.5)+'" cy="124.5" r="3.4" fill="#fff"/><circle cx="'+(cx+4.5)+'" cy="137" r="1.6" fill="#fff"/>'}
 function lid(d){return '<path d="'+d+'" fill="none" stroke="#8576AE" stroke-width="2" stroke-linecap="round"/>'}
 var trade=outfit==="trade",doc=outfit==="doc",stu=outfit==="student";
 var s='<svg '+(at||'')+' viewBox="'+(vb||'50 -16 236 356')+'" xmlns="http://www.w3.org/2000/svg">';
 s+='<path d="M186 316C238 326 276 300 270 262C266 238 246 226 232 238" fill="none" stroke="#4A4458" stroke-width="22" stroke-linecap="round"/><path d="M186 316C238 326 276 300 270 262C266 238 246 226 232 238" fill="none" stroke="#1B1620" stroke-width="19" stroke-linecap="round"/>';
 s+='<path d="M256 232C246 226 238 230 232 238" fill="none" stroke="#CFC8DA" stroke-width="22" stroke-linecap="round"/><path d="M256 232C246 226 238 230 232 238" fill="none" stroke="#fff" stroke-width="19" stroke-linecap="round"/>';
 s+='<path d="M140 198C178 198 200 244 198 298C197 324 182 336 140 336C98 336 83 324 82 298C80 244 102 198 140 198Z" fill="#1B1620" stroke="#4A4458" stroke-width="1.8"/>';
 s+='<path d="M92 296C94 264 112 258 122 290M188 296C186 264 168 258 158 290" fill="none" stroke="#33304A" stroke-width="1.4" stroke-linecap="round"/>';
 s+='<path d="M118 176L162 176L168 210L112 210Z" fill="#1B1620" stroke="#4A4458" stroke-width="1.8" stroke-linejoin="round"/>';
 s+='<path d="M126 184Q140 198 154 184L158 212L122 212Z" fill="#fff"/>';
 s+='<path d="M122 212Q140 226 158 212C168 250 162 292 140 306C118 292 112 250 122 212Z" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/>';
 s+='<path d="M130 246q4 4 8 0M144 252q4 4 8 0M134 272q6 4 12 0" fill="none" stroke="#E3DEEC" stroke-width="1.2" stroke-linecap="round"/>';
 if(doc){
  /* blouse blanche par-dessus le smoking, col en V sur une tunique bleue */
  s+='<path d="M140 198C178 198 200 244 198 298C197 324 182 336 140 336C98 336 83 324 82 298C80 244 102 198 140 198Z" fill="#F4F7FB" stroke="#B7C3D4" stroke-width="1.8"/>';
  s+='<path d="M122 206L140 268L158 206Q140 220 122 206Z" fill="#7FB6D9" stroke="#5E94B8" stroke-width="1.2" stroke-linejoin="round"/>';
  s+='<path d="M122 206L140 268M158 206L140 268" fill="none" stroke="#B7C3D4" stroke-width="1.4"/><path d="M104 290h16" fill="none" stroke="#B7C3D4" stroke-width="1.4" stroke-linecap="round"/><circle cx="140" cy="292" r="2.2" fill="#B7C3D4"/><circle cx="140" cy="310" r="2.2" fill="#B7C3D4"/>';
  s+='<path d="M116 208C106 254 124 282 140 282C156 282 174 254 164 208" fill="none" stroke="#46556B" stroke-width="3.2" stroke-linecap="round"/><circle cx="140" cy="287" r="6.5" fill="#B8C4D4" stroke="#46556B" stroke-width="2"/>';
 }else{
  if(trade){s+='<path d="M133 209h14l-2 9h-10z" fill="#C8372D" stroke="#8E241D" stroke-width="1"/><path d="M135 218h10l5 20L140 266l-10-28z" fill="#D8483D" stroke="#8E241D" stroke-width="1" stroke-linejoin="round"/>'}
  s+='<ellipse cx="120" cy="326" rx="15" ry="9" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/><ellipse cx="160" cy="326" rx="15" ry="9" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/>';
  s+='<path d="M112 204Q140 222 168 204" fill="none" stroke="#F2B705" stroke-width="5" stroke-linecap="round"/><rect x="137.5" y="219" width="5" height="9" rx="1.2" fill="#E8564E"/><path d="M140 219v-3" stroke="#F2B705" stroke-width="1.6" stroke-linecap="round"/>';
  if(trade){s+='<g transform="translate(93 246)"><path d="M4 0v20M12 4v18M20 -2v14" stroke="#F2C23A" stroke-width="1.6" stroke-linecap="round"/><rect x="1" y="5" width="6" height="9" fill="#2fcf9b"/><rect x="9" y="9" width="6" height="9" fill="#ff6e66"/><rect x="17" y="1" width="6" height="8" fill="#2fcf9b"/></g>'}
 }
 if(doc){s+='<ellipse cx="120" cy="326" rx="15" ry="9" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/><ellipse cx="160" cy="326" rx="15" ry="9" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/>'}
 s+='<path d="M92 98L86 42Q88 34 96 40L126 78Z" fill="#1B1620" stroke="#4A4458" stroke-width="1.8" stroke-linejoin="round"/><path d="M188 98L194 42Q192 34 184 40L154 78Z" fill="#1B1620" stroke="#4A4458" stroke-width="1.8" stroke-linejoin="round"/>';
 s+='<path d="M97 82L94 54L116 76Z" fill="#E88FA0"/><path d="M183 82L186 54L164 76Z" fill="#E88FA0"/>';
 s+='<path d="M86 120C86 84 110 72 140 72C170 72 194 84 194 120C194 158 172 190 140 192C108 190 86 158 86 120Z" fill="#1B1620" stroke="#4A4458" stroke-width="1.8"/>';
 s+='<path d="M140 132Q168 126 190 146Q188 174 162 188Q150 192 140 192Z" fill="#fff"/><path d="M190 146Q188 174 162 188Q150 192 140 192" fill="none" stroke="#CFC8DA" stroke-width="1.4"/>';
 s+='<path d="M137 100L143 100L147 126L140 140L133 126Z" fill="#fff"/>';
 s+='<path d="M104 112Q108 100 118 96M176 112Q172 100 162 96" fill="none" stroke="#33304A" stroke-width="1.4" stroke-linecap="round"/>';
 s+='<ellipse cx="126" cy="164" rx="15" ry="11" fill="#2A2530" stroke="#4A4458" stroke-width="1.2"/><ellipse cx="154" cy="164" rx="15" ry="11" fill="#fff" stroke="#CFC8DA" stroke-width="1.2"/>';
 s+='<ellipse cx="172" cy="152" rx="9" ry="5" fill="#F6959B" opacity=".5"/><ellipse cx="108" cy="152" rx="9" ry="5" fill="#6B3E58" opacity=".6"/>';
 s+=eye(116)+eye(164)+lid("M102 126Q116 112 130 124")+lid("M150 124Q164 112 178 126");
 s+='<path d="M134 148Q140 145.5 146 148Q143 155.5 140 157Q137 155.5 134 148Z" fill="#F29AA6" stroke="#C26A7A" stroke-width=".8" stroke-linejoin="round"/>';
 s+='<path d="M140 157L140 163M140 163Q133 171 125 165M140 163Q147 171 155 165" fill="none" stroke="#E88FA0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
 s+='<path d="M104 160L66 152M104 166L64 168M106 172L70 184" fill="none" stroke="#E8EEF6" stroke-width="1.4" stroke-linecap="round"/><path d="M176 160L214 152M176 166L216 168M174 172L210 184" fill="none" stroke="#9A94AC" stroke-width="1.4" stroke-linecap="round"/>';
 if(doc){
  /* miroir frontal */
  s+='<path d="M96 96Q140 74 184 96" fill="none" stroke="#8A94A6" stroke-width="6" stroke-linecap="round"/><circle cx="140" cy="82" r="14" fill="#DDE5EF" stroke="#8A94A6" stroke-width="2.2"/><circle cx="140" cy="82" r="4" fill="#1B1620"/><path d="M132 76Q136 72 142 73" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>';
 }else if(stu){
  /* lunettes rondes + toque de diplômé */
  s+='<circle cx="116" cy="130" r="19" fill="rgba(255,255,255,.12)" stroke="#2B3A55" stroke-width="3"/><circle cx="164" cy="130" r="19" fill="rgba(255,255,255,.12)" stroke="#2B3A55" stroke-width="3"/><path d="M135 128Q140 123 145 128" fill="none" stroke="#2B3A55" stroke-width="3" stroke-linecap="round"/>';
  s+='<path d="M108 80Q140 96 172 80L172 66Q140 80 108 66Z" fill="#1A2540" stroke="#0E1730" stroke-width="1.4" stroke-linejoin="round"/>';
  s+='<path d="M140 34L212 60L140 86L68 60Z" fill="#1A2540" stroke="#0E1730" stroke-width="1.6" stroke-linejoin="round"/><path d="M140 34L212 60L140 86L68 60Z" fill="none" stroke="#F2C23A" stroke-width="1" stroke-linejoin="round" transform="translate(0 1)" opacity=".7"/>';
  s+='<circle cx="140" cy="60" r="4" fill="#F2C23A"/><path d="M140 60L200 64L202 92" fill="none" stroke="#F2C23A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 90h10l-2 16h-6z" fill="#F2C23A" stroke="#C79A10" stroke-width="1" stroke-linejoin="round"/>';
 }else{
  /* coiffe bigoudène */
  s+='<path d="M114 100L108 22Q108-12 140-12Q172-12 172 22L166 100Z" fill="#fff" stroke="#1A2540" stroke-width="2"/>';
  s+='<path d="M125-4V94M155-4V94" stroke="#D4DEEC" stroke-width="1.2"/><path d="M140 8l5 6l-5 6l-5-6zM140 32l5 6l-5 6l-5-6zM140 56l5 6l-5 6l-5-6zM128 20l4 5l-4 5l-4-5zM152 20l4 5l-4 5l-4-5zM128 44l4 5l-4 5l-4-5zM152 44l4 5l-4 5l-4-5zM128 68l4 5l-4 5l-4-5zM152 68l4 5l-4 5l-4-5z" fill="none" stroke="#93A8C6" stroke-width="1"/>';
  s+='<ellipse cx="140" cy="97" rx="30" ry="7" fill="#fff" stroke="#1A2540" stroke-width="1.6"/>';
  s+='<path d="M102 88Q140 104 178 88L178 103Q140 119 102 103Z" fill="#1A2540" stroke="#F2B705" stroke-width="1.4"/>';
 }
 return s+'</svg>';
}
/* Fond de page : têtes d'Aros avec ses coiffes, en filigrane (motif répété, très discret) */
function arosPattern(){
 var heads=[["trade",40,30,-6],["doc",370,40,5],["student",40,300,-4],["trade",370,310,6]];
 var mq=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");
 function apply(){
  var op=(mq&&mq.matches)?0.1:0.07;
  var g=heads.map(function(h){return '<g transform="translate('+h[1]+' '+h[2]+') rotate('+h[3]+' 44 60)">'+arosSvg(h[0],"58 -18 164 224",'width="88" height="120"')+'</g>'}).join("");
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560"><g opacity="'+op+'">'+g+'</g></svg>';
  document.body.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
 }
 apply();if(mq&&mq.addEventListener)mq.addEventListener("change",apply);
}
arosPattern();
(function(){
var en=/^en/i.test(navigator.language||"");
var T=en?{
 eyebrow:"Training",h1:"Choose your module",lead:"One account, one place. Pick where you want to practise.",
 on:"Available",soon:"Coming soon",go:"Open Trade →",
 trade:"Learn to read the stock market: trends, Japanese candlesticks, limits… Levels 1 to 4 are free.",
 doc:"For high-school students who want a head start on medical studies.",stu:"To prepare for the baccalauréat (French high-school exam).",
 note:"Educational content only. Nothing here is investment advice, and past patterns do not guarantee future results.",title:"Choose your module",
 aTrade:"Aros the cat in a suit, red tie and candlestick pin",aDoc:"Aros the cat in a white coat with a stethoscope",aStu:"Aros the cat in a graduation cap and round glasses"
}:{
 eyebrow:"Entraînement",h1:"Choisis ton module",lead:"Un seul compte, un seul endroit. Choisis ce que tu veux travailler.",
 on:"Disponible",soon:"Bientôt",go:"Ouvrir Trade →",
 trade:"Apprends à lire la bourse : les tendances, les bougies japonaises, les limites… Les niveaux 1 à 4 sont gratuits.",
 doc:"Pour les lycéens qui souhaitent prendre de l'avance en vue des études de médecine.",stu:"Pour préparer le baccalauréat.",
 note:"Contenu éducatif uniquement. Rien ici n'est un conseil en investissement, et les figures passées ne garantissent pas les résultats futurs.",title:"Choisis ton module",
 aTrade:"Aros le chat en costume, cravate rouge et broche en bougies",aDoc:"Aros le chat en blouse blanche avec un stéthoscope",aStu:"Aros le chat avec une toque de diplômé et des lunettes rondes"
};
function set(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
function pic(id,outfit,label){var e=document.getElementById(id);if(e){e.innerHTML=arosSvg(outfit);e.setAttribute("aria-label",label)}}
document.documentElement.lang=en?"en":"fr";document.title=T.title;
set("eyebrow",T.eyebrow);set("h1",T.h1);set("lead",T.lead);set("t-on",T.on);set("t-doc",T.soon);set("t-stu",T.soon);
set("go",T.go);set("d-trade",T.trade);set("d-doc",T.doc);set("d-stu",T.stu);set("note",T.note);
pic("pic-trade","trade",T.aTrade);pic("pic-doc","doc",T.aDoc);pic("pic-stu","student",T.aStu);
})();
</script>
</body></html>
