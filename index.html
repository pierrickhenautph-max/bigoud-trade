 {lv:9,n:["Taille de position","Position size"],f:["(capital × risque en %) ÷ distance au stop","(capital × risk in %) ÷ distance to the stop"]},
 {lv:9,n:["Ratio risque/gain","Risk/reward ratio"],f:["distance à l’objectif ÷ distance au stop","distance to the target ÷ distance to the stop"]},
 {lv:9,n:["Espérance","Expectancy"],f:["% de gains × gain moyen − % de pertes × perte moyenne","win % × average win − loss % × average loss"]},
 {lv:9,n:["Capital après n pertes","Capital after n losses"],f:["capital × (1 − perte en %)^n","capital × (1 − loss in %)^n"]},
 {lv:10,n:["Perte si le stop est touché","Loss if the stop is hit"],f:["taille de position (% du capital) × distance au stop (%)","position size (% of capital) × distance to the stop (%)"]},
 {lv:10,n:["Taille selon le risque","Size from the risk"],f:["risque accepté (%) ÷ distance au stop (%) = taille en % du capital","accepted risk (%) ÷ distance to the stop (%) = size as % of capital"]}
];
/* ===== Module « Cours » : une leçon par thème, niveau par niveau ===== */
/* Chargé après p5.js, avant p3.js. Rien n'est exécuté au chargement. */

/* illustrations propres aux cours (déterministes) ; les clés de NIMG sont aussi utilisables */
const COURSEIMG={
 range:()=>svgOf({cs:detCandles(detC("range",44)),from:0,to:0},AR()),
 trade:()=>tradeChart(100,96,108,true),
 expect:()=>barsSvg([{v:2,label:L("Gain moyen","Average win"),top:"+2 R",sub:pc(40),cls:"u"},{v:1,label:L("Perte moyenne","Average loss"),top:"−1 R",sub:pc(60),cls:"d"}],AR()),
 plan:()=>{
  const b=build("marteau","down",null,E1),pat=b.cs.slice(b.from,b.to),high=Math.max(...pat.map(x=>x.h)),low=Math.min(...pat.map(x=>x.l)),T=high+2*(high-low),r=x=>Math.round(x*10)/10;
  b.hl=[{v:high,label:L("Entrée ","Entry ")+N1(r(high))},{v:low,label:"Stop "+N1(r(low))},{v:T,label:L("Objectif ","Target ")+N1(r(T))}];
  return svgOf(b,AR());
 },
 confirm:()=>svgOf(build("marteau","down",null,E1),AR()),
 invalid:()=>svgOf(build("marteau","down",null,E2),AR())
};

/* chaque leçon : t titre, p paragraphes, figs (fiches de figures), imgs [clé, légende], ctx3 (même figure dans 3 contextes), html, take (à retenir) */
const COURS={
1:{intro:["Une bougie résume une période avec quatre prix. Ce niveau apprend à lire une bougie seule et à reconnaître les formes classiques à une bougie.","A candle sums up a period with four prices. This level teaches you to read a single candle and recognize the classic one-candle shapes."],
 lessons:[
 {id:"l1",t:["Lire une bougie","Reading a candle"],html:"anat",
  p:[["Chaque bougie résume une période (1 minute, 1 heure, 1 jour…) avec quatre prix : l’ouverture, la clôture, le plus haut et le plus bas. Le corps relie l’ouverture à la clôture ; les mèches montrent les extrêmes atteints.","Each candle sums up a period (1 minute, 1 hour, 1 day…) with four prices: the open, the close, the high and the low. The body links the open to the close; the wicks show the extremes reached."],
     ["Une bougie verte clôture au-dessus de son ouverture : les acheteurs ont dominé. Une bougie rouge clôture en dessous : les vendeurs ont dominé. Un corps long exprime un mouvement net, un corps court de l’hésitation, une longue mèche le rejet d’un niveau de prix.","A green candle closes above its open: buyers dominated. A red candle closes below: sellers dominated. A long body shows a clear move, a short body hesitation, a long wick the rejection of a price level."]],
  take:["La couleur ne suffit pas : la forme, la position et le contexte comptent autant.","Color is not enough: shape, position and context matter just as much."]},
 {id:"l2",t:["Mèches longues : marteau, homme pendu, étoile filante, marteau inversé","Long wicks: hammer, hanging man, shooting star, inverted hammer"],figs:["marteau","pendu","filante","inverse"],
  p:[["Quatre figures ont une petite tête et une longue mèche. La forme ne suffit pas à les nommer : c’est la position qui décide. Longue mèche basse après une baisse : marteau (signal haussier). Même forme après une hausse : homme pendu (alerte baissière). Longue mèche haute après une hausse : étoile filante (baissier). Même forme après une baisse : marteau inversé (haussier fragile).","Four patterns have a small head and a long wick. Shape alone does not name them: position decides. Long lower wick after a decline: hammer (bullish signal). Same shape after a rise: hanging man (bearish warning). Long upper wick after a rise: shooting star (bearish). Same shape after a decline: inverted hammer (fragile bullish)."],
     ["Aucune ne se suffit à elle-même : on attend une bougie de confirmation (clôture au-delà du corps de la figure) avant de conclure.","None of them is enough on its own: you wait for a confirmation candle (a close beyond the pattern’s body) before concluding."]],
  take:["Même silhouette, noms différents : le contexte décide, la confirmation valide.","Same silhouette, different names: context decides, confirmation validates."]},
 {id:"l3",t:["Indécision et domination : doji, toupie, marubozu","Indecision and domination: doji, spinning top, marubozu"],figs:["doji","libel","tombe","toupie","maruH","maruB"],
  p:[["Le doji (ouverture ≈ clôture) et la toupie (petit corps entre deux mèches) traduisent l’hésitation : ni les acheteurs ni les vendeurs n’ont gagné. Après une tendance longue, ils peuvent annoncer un essoufflement ; dans un range, ils n’apportent presque rien.","The doji (open ≈ close) and the spinning top (small body between two wicks) show hesitation: neither buyers nor sellers won. After a long trend they can signal exhaustion; in a range they add almost nothing."],
     ["Le marubozu est l’inverse : un corps plein, sans mèche, signe d’une domination totale d’un camp. Il confirme la force du mouvement en cours, mais après une longue course il peut aussi marquer un excès.","The marubozu is the opposite: a full body with no wick, the sign of total domination by one side. It confirms the strength of the current move, but after a long run it can also mark an excess."]],
  take:["Indécision = pause, pas direction : la bougie suivante tranche.","Indecision = a pause, not a direction: the next candle decides."]}
 ]},
2:{intro:["Une figure à deux bougies compare deux séances : la seconde répond à la première. Ce niveau couvre les avalements, le harami, la pénétrante, le nuage noir et les pinces.","A two-candle pattern compares two sessions: the second answers the first. This level covers engulfings, harami, piercing line, dark cloud cover and tweezers."],
 lessons:[
 {id:"l1",t:["Avalements et harami","Engulfings and harami"],figs:["avH","avB","haramiH","haramiB"],
  p:[["Dans un avalement, le corps de la seconde bougie englobe entièrement celui de la première : un camp reprend toute la séance précédente d’un coup. Plus la bougie est grande et le volume élevé, plus le signal pèse. Le harami en est le miroir : une grande bougie suivie d’une petite contenue dans son corps. L’élan est brisé, mais rien n’est encore retourné.","In an engulfing, the second candle’s body completely covers the first’s: one side takes back the whole previous session at once. The bigger the candle and the higher the volume, the more the signal weighs. The harami is its mirror: a large candle followed by a small one contained within its body. Momentum is broken, but nothing has reversed yet."],
     ["Un avalement est un signal fort, mais seulement en bas d’une baisse ou en haut d’une hausse. Dans un range, il ne prouve presque rien.","An engulfing is a strong signal, but only at the bottom of a decline or the top of a rise. In a range it proves almost nothing."]],
  take:["Avalement = un camp efface la séance de l’autre ; harami = l’élan s’arrête sans se retourner.","Engulfing = one side erases the other’s session; harami = momentum stops without reversing."]},
 {id:"l2",t:["Pénétrante, nuage noir et pinces","Piercing line, dark cloud cover and tweezers"],figs:["penet","nuage","pinceB","pinceH"],
  p:[["La pénétrante et le nuage noir sont des avalements incomplets : la seconde bougie ne dépasse pas l’ouverture de la première, mais franchit le milieu de son corps. Le signal est plus faible qu’un avalement. Les pinces (tweezers) reposent sur un autre principe : deux bougies atteignent le même extrême, ce qui montre qu’un niveau a été testé deux fois sans céder.","The piercing line and dark cloud cover are incomplete engulfings: the second candle does not exceed the first’s open, but crosses the middle of its body. The signal is weaker than an engulfing. Tweezers rely on another principle: two candles reach the same extreme, which shows a level was tested twice without giving way."],
     ["Ces figures supposent souvent un écart d’ouverture (gap), rare sur les marchés ouverts 24 h sur 24 : on les lit avec souplesse.","These patterns often assume an opening gap, rare on markets open 24/7: read them with some flexibility."]],
  take:["Deux bougies = un duel : la seconde dit qui a repris la main.","Two candles = a duel: the second says who took back control."]}
 ]},
3:{intro:["Trois bougies racontent une histoire complète : l’élan, la pause, puis la réponse. Ce niveau couvre les étoiles du matin et du soir, les soldats, les corbeaux et les lignes de frappe.","Three candles tell a full story: the move, the pause, then the answer. This level covers morning and evening stars, soldiers, crows and three line strikes."],
 lessons:[
 {id:"l1",t:["Étoiles du matin et du soir","Morning and evening stars"],figs:["matin","soir"],
  p:[["L’étoile du matin enchaîne une grande bougie rouge, une petite bougie (l’étoile, souvent après un gap) puis une grande bougie verte qui remonte au-delà du milieu de la première : la panique vendeuse s’arrête, les acheteurs prennent le relais. L’étoile du soir est son miroir en haut d’une hausse.","The morning star chains a large red candle, a small candle (the star, often after a gap) then a large green candle climbing back past the middle of the first: selling panic stops and buyers take over. The evening star is its mirror at the top of a rise."],
     ["Si la bougie du milieu est un doji, la figure est jugée plus forte. Sans gap (cas fréquent en crypto ou en forex), on accepte une étoile qui ne se détache pas franchement.","If the middle candle is a doji, the pattern is considered stronger. Without a gap (common in crypto or forex), you accept a star that does not clearly detach."]],
  take:["Élan, pause, réponse : l’étoile marque le moment où le camp dominant lâche prise.","Move, pause, answer: the star marks the moment the dominant side lets go."]},
 {id:"l2",t:["Soldats, corbeaux et lignes de frappe","Soldiers, crows and three line strikes"],figs:["soldats","corbeaux","frappeH","frappeB"],
  p:[["Trois soldats blancs : trois bougies vertes pleines, chacune ouvrant dans le corps de la précédente et clôturant plus haut. Trois corbeaux noirs : le même scénario à la baisse. Ils montrent une pression continue. Attention à la version fatiguée : des corps de plus en plus petits et des mèches qui s’allongent annoncent un essoufflement.","Three white soldiers: three full green candles, each opening within the previous body and closing higher. Three black crows: the same story downward. They show sustained pressure. Beware of the tired version: ever smaller bodies and lengthening wicks announce exhaustion."],
     ["Les trois lignes de frappe comptent en réalité quatre bougies : trois dans un sens, puis une grande bougie contraire qui efface tout. La lecture classique est une continuation de la tendance, mais elle est débattue : on attend une confirmation.","The three line strike actually counts four candles: three in one direction, then a large opposite candle erasing everything. The classic reading is a trend continuation, but it is debated: wait for confirmation."]],
  take:["Trois bougies dans le même sens = pression continue ; la taille des corps dit si elle faiblit.","Three candles in the same direction = sustained pressure; body size tells you whether it is fading."]}
 ]},
4:{intro:["Une figure ne vaut que par son contexte. Ce niveau apprend à situer une figure : dans quelle tendance, sur quel niveau, avec quelle confirmation.","A pattern is only worth its context. This level teaches you to place a pattern: in which trend, on which level, with which confirmation."],
 lessons:[
 {id:"l1",t:["Tendance et range","Trend and range"],imgs:[["trend",["Tendance haussière : sommets et creux de plus en plus hauts.","Uptrend: ever higher highs and lows."]],["range",["Range : le prix oscille entre un plancher et un plafond.","Range: price oscillates between a floor and a ceiling."]]],
  p:[["Une tendance est une suite de sommets et de creux de plus en plus hauts (hausse) ou de plus en plus bas (baisse). Dans un range, le prix oscille entre un plancher et un plafond sans direction. Une figure de retournement n’a de sens que s’il y a une tendance à retourner.","A trend is a series of ever higher (uptrend) or ever lower (downtrend) highs and lows. In a range, price oscillates between a floor and a ceiling with no direction. A reversal pattern only makes sense if there is a trend to reverse."]],
  take:["Avant de lire une figure, demande-toi : tendance ou range ?","Before reading a pattern, ask yourself: trend or range?"]},
 {id:"l2",t:["Une figure, trois contextes","One pattern, three contexts"],ctx3:"marteau",
  p:[["Le même marteau n’a pas la même valeur en bas d’une baisse (il suggère l’essoufflement des vendeurs), au milieu d’un range (presque rien) ou après une hausse (c’est alors un homme pendu, alerte baissière). Avant de lire une figure, regarde ce qui la précède.","The same hammer does not have the same value at the bottom of a decline (it suggests sellers are tiring), in the middle of a range (almost nothing) or after a rise (then it is a hanging man, a bearish warning). Before reading a pattern, look at what precedes it."]],
  take:["La forme est la même ; la valeur change avec ce qui précède.","The shape is the same; the value changes with what precedes it."]},
 {id:"l3",t:["Confirmation, niveaux et échelle de temps","Confirmation, levels and timeframe"],imgs:[["confirm",["Le marteau (zone colorée) est suivi d’une bougie verte qui clôture au-dessus de son corps : signal confirmé.","The hammer (colored zone) is followed by a green candle closing above its body: signal confirmed."]]],
  p:[["Une figure est une hypothèse ; la bougie suivante la confirme ou l’invalide : une clôture au-delà du corps de la figure confirme, une clôture au-delà de son extrême l’invalide. Une figure placée sur un support ou une résistance pèse davantage.","A pattern is a hypothesis; the next candle confirms or invalidates it: a close beyond the pattern’s body confirms, a close beyond its extreme invalidates. A pattern at a support or resistance weighs more."],
     ["Enfin, plus la période d’une bougie est longue, plus la figure pèse : une figure hebdomadaire résume bien plus d’échanges qu’une figure à 1 minute.","Finally, the longer a candle’s period, the more the pattern weighs: a weekly pattern sums up far more trades than a 1-minute one."]],
  take:["Figure + contexte + confirmation + niveau : plus il y a d’éléments alignés, plus le signal est crédible.","Pattern + context + confirmation + level: the more elements line up, the more credible the signal."]}
 ]},
5:{intro:["Un graphique à long terme se lit autrement : on cherche la direction de fond, on distingue une correction d’un retournement, on repère les niveaux et on s’aide de quelques outils.","A long-term chart reads differently: you look for the underlying direction, tell a pullback from a reversal, spot levels and use a few tools."],
 lessons:[
 {id:"l1",t:["Tendance de fond et structure","Underlying trend and structure"],imgs:[["trend",["Tendance de fond haussière malgré les petits replis.","Underlying uptrend despite the small pullbacks."]],["swing",["Swing haut et swing bas : les sommets et creux locaux qui dessinent la structure.","Swing high and swing low: the local peaks and troughs that draw the structure."]]],
  p:[["La tendance de fond est la direction dominante malgré les petits replis. On la lit à travers sa structure : en hausse, chaque sommet et chaque creux dépasse le précédent. Les swing hauts et swing bas sont les sommets et creux locaux qui dessinent cette structure.","The underlying trend is the dominant direction despite small pullbacks. You read it through its structure: in an uptrend, every high and every low exceeds the previous one. Swing highs and swing lows are the local peaks and troughs that draw this structure."]],
  take:["Une tendance se lit dans la suite des sommets et des creux, pas dans une seule bougie.","A trend is read in the sequence of highs and lows, not in a single candle."]},
 {id:"l2",t:["Correction, retournement et cassure","Pullback, reversal and breakout"],imgs:[["pullback",["Le repli final reste au-dessus du dernier creux : simple correction.","The final pullback stays above the last low: a simple correction."]],["breakout",["Cassure d’une résistance par une clôture au-dessus du niveau.","Breakout of a resistance with a close above the level."]],["trendline",["Ligne de tendance reliant les creux.","Trendline joining the lows."]]],
  p:[["Un repli qui ne casse pas le dernier creux est une correction : la tendance reste intacte. Si le prix passe sous ce creux, la structure est remise en cause et un retournement devient possible.","A pullback that does not break the last low is a correction: the trend stays intact. If price falls below that low, the structure is in doubt and a reversal becomes possible."],
     ["Même logique pour les supports et résistances : une cassure est crédible avec une clôture au-delà du niveau, mais on ne saura jamais à l’avance si elle tiendra (fausse cassure). Une ligne de tendance relie au moins deux creux ou deux sommets ; son tracé reste subjectif.","Same logic for supports and resistances: a breakout is credible with a close beyond the level, but you will never know in advance whether it will hold (false breakout). A trendline joins at least two lows or two highs; its position remains subjective."]],
  take:["Le dernier creux est la ligne de vie d’une tendance haussière : tant qu’il tient, c’est une correction.","The last low is the lifeline of an uptrend: as long as it holds, it is a correction."]},
 {id:"l3",t:["Moyenne mobile, volume et échelles de temps","Moving average, volume and timeframes"],imgs:[["ma",["Le prix reste au-dessus d’une moyenne mobile qui monte : biais haussier.","Price stays above a rising moving average: bullish bias."]],["volume",["Deux séances à volume nettement plus fort que les autres.","Two sessions with clearly heavier volume than the others."]]],
  p:[["<b>1. La moyenne mobile.</b> Le prix fait des allers-retours d’une bougie à l’autre, ce qui rend la direction difficile à voir. La moyenne mobile (MM) corrige cela : à chaque bougie, on calcule la moyenne des N dernières clôtures. Exemple avec N = 5 et des clôtures 10, 11, 12, 11, 13 : (10 + 11 + 12 + 11 + 13) ÷ 5 = 11,4. À la bougie suivante, on retire la plus ancienne et on ajoute la nouvelle : la moyenne « se déplace », d’où son nom. En reliant ces points, on obtient une ligne lisse qui efface le bruit.","<b>1. The moving average.</b> Price zigzags from one candle to the next, which makes the direction hard to see. The moving average (MA) fixes that: on each candle, we compute the average of the last N closes. Example with N = 5 and closes 10, 11, 12, 11, 13: (10 + 11 + 12 + 11 + 13) ÷ 5 = 11.4. On the next candle, we drop the oldest close and add the new one: the average “moves”, hence its name. Joining these points gives a smooth line that erases the noise."],
     ["<b>Comment la lire :</b> regarde trois choses. <b>La pente</b> : qui monte, tendance haussière ; qui descend, tendance baissière ; presque plate, range. <b>La position du prix</b> : au-dessus d’une MM qui monte, biais haussier ; sous une MM qui descend, biais baissier. <b>Le contact</b> : dans une tendance, le prix revient souvent toucher la MM avant de repartir ; elle joue alors le rôle d’un support (en hausse) ou d’une résistance (en baisse).","<b>How to read it:</b> look at three things. <b>The slope</b>: rising means uptrend, falling means downtrend, nearly flat means range. <b>The price position</b>: above a rising MA, bullish bias; below a falling MA, bearish bias. <b>The contact</b>: in a trend, price often comes back to touch the MA before moving on; it then acts as a support (in an uptrend) or a resistance (in a downtrend)."],
     ["<b>Ses limites :</b> elle est calculée avec le passé, donc elle est toujours en retard : elle confirme une tendance, elle ne l’annonce pas. Le choix de N compte : une MM courte (10) réagit vite mais donne plus de faux signaux ; une MM longue (200) est lente mais plus stable. Dans un range, le prix la traverse sans cesse et ses signaux deviennent trompeurs.","<b>Its limits:</b> it is computed from the past, so it is always late: it confirms a trend, it does not announce one. The choice of N matters: a short MA (10) reacts fast but gives more false signals; a long MA (200) is slow but steadier. In a range, price crosses it all the time and its signals become misleading."],
     ["<b>2. Le volume.</b> Le volume est la quantité échangée pendant une bougie (nombre d’actions, de contrats ou de lots). On l’affiche sous le graphique, en barres : une barre par bougie. Beaucoup d’acheteurs et de vendeurs actifs, c’est beaucoup de volume : il mesure l’intérêt du marché pour ce mouvement.","<b>2. Volume.</b> Volume is the quantity traded during a candle (number of shares, contracts or lots). It is shown under the chart as bars: one bar per candle. Many active buyers and sellers means high volume: it measures the market’s interest in that move."],
     ["<b>Comment le lire :</b> un mouvement (une hausse, la cassure d’un support ou d’une résistance, une figure de chandeliers) sur gros volume est plus crédible, car beaucoup de monde y participe. Sur faible volume, il est moins fiable et peut s’inverser vite. Un volume qui s’éteint pendant une hausse signale un élan qui s’essouffle. Exemple : une bougie verte qui franchit une résistance avec un volume double de la normale convainc davantage que la même bougie sur un volume faible. Limite : sur certains marchés (le forex, par exemple), il n’existe pas de volume centralisé, donc l’information est moins fiable.","<b>How to read it:</b> a move (a rise, a break of a support or resistance, a candlestick pattern) on heavy volume is more credible, because many people take part in it. On light volume it is less reliable and can reverse quickly. Volume fading during a rise signals fading momentum. Example: a green candle breaking a resistance on twice the usual volume is more convincing than the same candle on low volume. Limit: on some markets (forex, for example) there is no centralized volume, so the information is less reliable."],
     ["<b>3. Les échelles de temps.</b> Une bougie résume une période : 1 minute, 1 heure, 1 jour, 1 semaine. Pour un même marché au même moment, l’image change selon l’échelle choisie : sur 1 minute, on voit chaque oscillation ; sur 1 semaine, on ne voit que la tendance de fond.","<b>3. Timeframes.</b> A candle sums up a period: 1 minute, 1 hour, 1 day, 1 week. For the same market at the same moment, the picture changes with the timeframe: on 1 minute you see every swing; on 1 week you only see the underlying trend."],
     ["<b>Pourquoi c’est important :</b> une action qui monte depuis trois jours (tendance haussière sur le graphique journalier) peut n’être qu’un petit rebond dans une baisse de plusieurs mois, visible sur le graphique hebdomadaire. Bonne habitude : regarder d’abord l’échelle longue pour connaître la tendance de fond, puis descendre vers l’échelle courte pour affiner. Plus la période est longue, plus les figures, les moyennes mobiles et les niveaux pèsent.","<b>Why it matters:</b> a stock that has risen for three days (uptrend on the daily chart) may be just a small rebound inside a multi-month decline, visible on the weekly chart. Good habit: look at the long timeframe first to know the underlying trend, then move down to the short timeframe to refine. The longer the period, the more patterns, moving averages and levels weigh."]],
  take:["Avant de lire un graphique, trois questions : dans quelle échelle de temps suis-je ? Que dit la pente de la moyenne mobile ? Le volume confirme-t-il le mouvement ? Ces outils confirment, ils ne devancent pas.","Before reading a chart, three questions: which timeframe am I in? What does the moving average’s slope say? Does volume confirm the move? These tools confirm, they do not anticipate."]}
 ]},
6:{intro:["Pour juger un gain ou une perte, il faut savoir le mesurer : pourcentages, variations successives, retour à l’équilibre, durée.","To judge a gain or a loss, you must be able to measure it: percentages, successive changes, break-even, duration."],
 lessons:[
 {id:"l1",t:["Le pourcentage : toujours par rapport au départ","Percentages: always against the start"],imgs:[["pct",["De 100 à 125 : +25 %.","From 100 to 125: +25%."]],["recover",["Après −50 %, il faut +100 % pour revenir au départ.","After −50%, you need +100% to get back to the start."]]],
  p:[["Une variation en pourcentage se calcule par rapport au prix de départ : (nouveau − ancien) ÷ ancien. Passer de 80 à 100 est +25 % ; redescendre de 100 à 80 est −20 %, pas −25 %, car la base a changé.","A percentage change is measured against the starting price: (new − old) ÷ old. Going from 80 to 100 is +25%; going back from 100 to 80 is −20%, not −25%, because the base has changed."],
     ["C’est pourquoi une perte demande un gain plus grand pour être effacée : après −X %, il faut X ÷ (100 − X). −50 % exige +100 %, −75 % exige +300 %.","That is why a loss needs a larger gain to be erased: after −X%, you need X ÷ (100 − X). −50% requires +100%, −75% requires +300%."]],
  take:["Le point de départ change à chaque variation : −50 % puis +50 % ne ramène pas à zéro.","The starting point changes with every move: −50% then +50% does not bring you back to zero."]},
 {id:"l2",t:["Composer les variations","Compounding changes"],imgs:[["compose",["+50 % puis −50 % laisse 75, soit −25 %.","+50% then −50% leaves 75, i.e. −25%."]],["compound",["À 8 % par an, la composition (bleu) dépasse nettement l’addition simple (gris).","At 8% a year, compounding (blue) clearly beats simple addition (grey)."]]],
  p:[["Des pourcentages successifs se multiplient, ils ne s’additionnent pas : +50 % puis −50 % donne 1,5 × 0,5 = 0,75, soit −25 %. La moyenne arithmétique (0 %) est trompeuse.","Successive percentages multiply, they do not add: +50% then −50% gives 1.5 × 0.5 = 0.75, i.e. −25%. The arithmetic average (0%) is misleading."],
     ["Le même mécanisme fait croître un capital à intérêts composés : à 8 % par an, 100 deviennent environ 466 en 20 ans, contre 260 sans composition. Il joue aussi contre toi pour les pertes et les frais.","The same mechanism makes capital grow with compound interest: at 8% a year, 100 becomes about 466 in 20 years, against 260 without compounding. It also works against you for losses and fees."]],
  take:["Pour enchaîner deux variations : (1 + a) × (1 + b) − 1.","To chain two changes: (1 + a) × (1 + b) − 1."]},
 {id:"l3",t:["Mesurer une baisse et comparer des durées","Measuring a fall and comparing durations"],imgs:[["drawdown",["Le drawdown : −24 % entre le sommet à 125 et le creux à 95.","The drawdown: −24% between the peak at 125 and the trough at 95."]]],
  p:[["Le drawdown mesure la baisse entre un sommet et le creux suivant, en pourcentage du sommet : c’est la mesure du pire moment vécu. Un drawdown de 50 % demande +100 % pour être effacé, et il se supporte aussi psychologiquement.","Drawdown measures the fall from a peak to the next trough, as a percentage of the peak: it is the measure of the worst moment lived through. A 50% drawdown needs +100% to be erased, and it must also be endured psychologically."],
     ["Pour comparer deux performances obtenues sur des durées différentes, on les annualise : (valeur finale ÷ valeur initiale)^(1 ÷ années) − 1. +21 % sur 2 ans, c’est +10 % par an. Annualiser quelques jours donne des chiffres spectaculaires mais trompeurs.","To compare performances over different durations, you annualize them: (final value ÷ initial value)^(1 ÷ years) − 1. +21% over 2 years is +10% a year. Annualizing a few days gives spectacular but misleading figures."]],
  take:["Un rendement sans sa durée, ou sans son pire drawdown, ne dit pas grand-chose.","A return without its duration, or without its worst drawdown, says little."]}
 ]},
7:{intro:["Le levier permet de contrôler une position plus grande que son capital. Il amplifie les gains comme les pertes : ce niveau apprend à le mesurer et à en connaître les limites. Le simulateur de levier du lexique permet de s’exercer.","Leverage lets you control a position larger than your capital. It amplifies gains and losses alike: this level teaches you to measure it and to know its limits. The leverage simulator in the lexicon lets you practice."],
 lessons:[
 {id:"l1",t:["Exposition et amplification","Exposure and amplification"],imgs:[["leverage",["Avec ×5, les gains et les pertes sont multipliés par 5 de part et d’autre de zéro.","With ×5, gains and losses are multiplied by 5 on both sides of zero."]]],
  p:[["Le levier est un mécanisme qui permet de prendre une position plus grande que son capital : l’argent en plus est emprunté au courtier. Le levier est le rapport entre la taille de la position et ton capital. Un levier ×5 signifie que la position vaut 5 fois ton capital ; sans levier (×1), elle vaut exactement ton capital.","Leverage is a mechanism that lets you take a position larger than your capital: the extra money is borrowed from the broker. Leverage is the ratio between the size of the position and your capital. ×5 leverage means the position is worth 5 times your capital; with no leverage (×1), it is worth exactly your capital."],
     ["Avec un levier ×5, 1 000 € de capital contrôlent 5 000 € de position : c’est l’exposition. Le résultat se calcule sur l’exposition : +2 % sur le prix donne +100 € (+10 % du capital), mais −2 % donne −100 €.","With ×5 leverage, €1,000 of capital controls a €5,000 position: that is exposure. The result is computed on exposure: +2% on the price gives +€100 (+10% of capital), but −2% gives −€100."],
     ["Le levier ne crée aucun rendement : il multiplie les deux côtés dans la même proportion.","Leverage creates no return: it multiplies both sides in the same proportion."],
     ["Cet emprunt a un coût. Garder une position à levier d’un jour à l’autre coûte des frais de financement : un intérêt, prélevé chaque nuit, sur la somme empruntée (et non sur ton seul capital). Selon le produit et le courtier, s’ajoutent des commissions ou un écart entre prix d’achat et de vente (le spread), calculés sur toute la position. Négligeables sur quelques heures, ces frais pèsent lourd sur des positions gardées plusieurs semaines. Les montants varient d’un courtier à l’autre : vérifie toujours la grille de frais.","This loan has a cost. Holding a leveraged position overnight costs financing fees: interest, charged each night, on the borrowed amount (not just on your own capital). Depending on the product and broker, commissions or the gap between buying and selling price (the spread) are added, computed on the whole position. Negligible over a few hours, these fees weigh heavily on positions held for several weeks. Amounts vary from one broker to another: always check the fee schedule."]],
  take:["Exposition = capital × levier ; résultat = exposition × variation du prix, moins les frais de financement.","Exposure = capital × leverage; result = exposure × price change, minus financing fees."]},
 {id:"l2",t:["Marge, appel de marge et liquidation","Margin, margin call and liquidation"],imgs:[["liquidation",["À ×10, la ligne atteint −100 % du capital pour une baisse du prix de 10 %.","At ×10, the line reaches −100% of capital for a 10% fall in price."]],["marginCall",["Le capital s’érode : appel de marge, puis liquidation.","Capital erodes: margin call, then liquidation."]]],
  p:[["La marge est le capital déposé en garantie. Quand les pertes la grignotent, le courtier peut demander des fonds (appel de marge), puis fermer la position d’office (liquidation).","Margin is capital deposited as collateral. When losses eat into it, the broker may ask for funds (margin call), then close the position automatically (liquidation)."],
     ["Le seuil théorique est d’environ 100 ÷ levier : à ×10, une baisse de 10 % suffit à effacer le capital engagé. En pratique, les frais et la marge de maintien le rapprochent.","The theoretical threshold is about 100 ÷ leverage: at ×10, a 10% fall is enough to wipe out the committed capital. In practice, fees and maintenance margin bring it closer."]],
  take:["Plus le levier est haut, plus le prix a peu de marge avant liquidation.","The higher the leverage, the less room price has before liquidation."]},
 {id:"l3",t:["Vente à découvert et coûts cachés","Short selling and hidden costs"],imgs:[["short",["Vente à 100, rachat à 85 : gain de 15 par unité.","Sale at 100, buyback at 85: a gain of 15 per unit."]],["gap",["Un gap saute le stop à 97 : exécution vers 92.","A gap jumps the stop at 97: filled around 92."]]],
  p:[["Vendre à découvert, c’est vendre un actif emprunté pour le racheter moins cher : on gagne si le prix baisse, mais la perte est théoriquement illimitée puisqu’un prix peut monter sans plafond.","Short selling means selling a borrowed asset to buy it back cheaper: you gain if the price falls, but the loss is theoretically unlimited since a price can rise without a cap."],
     ["Les positions à levier gardées la nuit paient des frais de financement, et un gap ou du slippage peut faire exécuter un stop plus loin que prévu. Surveille aussi le levier effectif : exposition totale ÷ capital total, surtout avec des positions corrélées.","Leveraged positions held overnight pay financing fees, and a gap or slippage can make a stop fill further away than planned. Also watch effective leverage: total exposure ÷ total capital, especially with correlated positions."]],
  take:["Un stop limite le risque sans le supprimer, surtout avec un levier élevé.","A stop limits risk without removing it, especially with high leverage."]}
 ]},
8:{intro:["Les dérivés sont des contrats dont la valeur dépend d’un actif sous-jacent. Ce niveau se concentre sur les profils de gain et de perte à l’échéance, qui permettent de comprendre le risque sans jargon. Contenu pédagogique, pas un conseil d’investissement.","Derivatives are contracts whose value depends on an underlying asset. This level focuses on payoff profiles at expiry, which let you understand risk without jargon. Educational content, not investment advice."],
 lessons:[
 {id:"l1",t:["Call et put","Call and put"],imgs:[["option",["Achat d’un call (vert) et d’un put (rouge), même strike.","Buying a call (green) and a put (red), same strike."]],["premium",["La perte de l’acheteur est limitée à la prime.","The buyer’s loss is limited to the premium."]]],
  p:[["Un call donne le droit d’acheter à un prix fixé (le strike), un put celui de vendre, contre le paiement d’une prime. L’acheteur d’une option perd au plus la prime ; son gain peut être important (call) ou limité par le zéro (put).","A call gives the right to buy at a fixed price (the strike), a put the right to sell, in exchange for a premium. The option buyer loses at most the premium; the gain can be large (call) or capped by zero (put)."],
     ["Le vendeur encaisse la prime mais s’expose à une perte élevée, illimitée pour un call vendu. À l’échéance, un call acheté vaut max(S − K, 0) − prime et un put acheté max(K − S, 0) − prime.","The seller collects the premium but is exposed to a large loss, unlimited for a sold call. At expiry, a bought call is worth max(S − K, 0) − premium and a bought put max(K − S, 0) − premium."]],
  take:["Acheter une option : risque limité à la prime. Vendre une option : gain limité à la prime.","Buying an option: risk limited to the premium. Selling an option: gain limited to the premium."]},
 {id:"l2",t:["Dans la monnaie, valeur intrinsèque et temps","In the money, intrinsic value and time"],imgs:[["moneyness",["Hors de la monnaie, à la monnaie et dans la monnaie pour un call.","Out of, at and in the money for a call."]],["intrinsic",["La valeur temps (pointillés) fond jusqu’à zéro à l’échéance.","Time value (dashed) melts to zero at expiry."]]],
  p:[["Un call est dans la monnaie si le prix est au-dessus du strike, hors de la monnaie s’il est en dessous (l’inverse pour un put). La prime se compose de la valeur intrinsèque (ce que vaudrait l’option si elle expirait maintenant) et de la valeur temps (le pari sur ce qui peut encore arriver).","A call is in the money if price is above the strike, out of the money if below (the reverse for a put). The premium is made of intrinsic value (what the option would be worth if it expired now) and time value (the bet on what may still happen)."],
     ["La valeur temps fond jusqu’à zéro à l’échéance, et plus vite à l’approche de celle-ci : l’acheteur d’option lutte contre le temps.","Time value melts to zero at expiry, and faster as it approaches: the option buyer fights against time."]],
  take:["Une option hors de la monnaie coûte peu mais expire le plus souvent sans valeur.","An out-of-the-money option is cheap but most often expires worthless."]},
 {id:"l3",t:["Futures, CFD et couverture","Futures, CFDs and hedging"],imgs:[["future",["Le future (gris) suit le prix sans plafond de perte ; le call (pointillés) limite la perte à la prime.","The future (grey) follows the price with no cap on the loss; the call (dashed) limits the loss to the premium."]],["hedge",["Action + put : un plancher sous le strike, au prix de la prime.","Stock + put: a floor below the strike, at the cost of the premium."]]],
  p:[["Un future est une obligation d’acheter ou de vendre à un prix et une date fixés : son résultat suit le prix dans les deux sens, sans plafond de perte. Un CFD reproduit l’évolution d’un actif, souvent avec levier et frais de financement : produit risqué, restreint pour les particuliers dans plusieurs pays.","A future is an obligation to buy or sell at a fixed price and date: its result follows the price both ways, with no cap on the loss. A CFD tracks an asset’s move, often with leverage and financing fees: a risky product, restricted for retail clients in several countries."],
     ["Les dérivés servent aussi à se couvrir : posséder une action et acheter un put crée un plancher, au prix de la prime. Se couvrir coûte : on renonce à une partie du rendement.","Derivatives are also used to hedge: owning a stock and buying a put creates a floor, at the cost of the premium. Hedging costs money: you give up part of the return."]],
  take:["Obligation (future) ou droit (option) : la différence est dans la perte maximale.","Obligation (future) or right (option): the difference is in the maximum loss."]}
 ]},
9:{intro:["On ne contrôle pas le marché, on contrôle ce qu’on risque. Ce niveau apprend à dimensionner une position, à juger un plan et à survivre aux mauvaises séries.","You do not control the market, you control what you risk. This level teaches you to size a position, judge a plan and survive bad streaks."],
 lessons:[
 {id:"l1",t:["Risque par trade et taille de position","Risk per trade and position size"],imgs:[["trade",["Entrée 100, stop 96, objectif 108 : on risque 4 pour viser 8.","Entry 100, stop 96, target 108: you risk 4 to aim for 8."]]],
  p:[["On décide d’abord du risque accepté sur un trade, par exemple 1 % du capital. Le stop fixe ensuite la distance de risque par unité, et la taille de la position s’en déduit : taille = (capital × risque %) ÷ distance au stop. Avec 10 000 €, 1 % de risque (100 €) et un stop à 2 de l’entrée, on peut prendre 50 unités.","You first decide the risk accepted on a trade, for example 1% of capital. The stop then sets the risk distance per unit, and position size follows: size = (capital × risk %) ÷ distance to the stop. With €10,000, 1% risk (€100) and a stop 2 away from entry, you can take 50 units."],
     ["Le stop se place juste au-delà de l’extrême de la figure : si le prix y arrive, le scénario est invalidé. Trop proche, il saute sur le bruit ; trop loin, la perte est inutilement grande.","The stop goes just beyond the pattern’s extreme: if price gets there, the scenario is invalidated. Too close and it is hit by noise; too far and the loss is needlessly large."]],
  take:["La taille découle du stop, pas de l’envie de gagner.","Size follows from the stop, not from the wish to win."]},
 {id:"l2",t:["Ratio risque/gain et espérance","Risk/reward and expectancy"],imgs:[["rmult",["Entrée 100, stop 98, objectif 104 : −1 R ou +2 R.","Entry 100, stop 98, target 104: −1 R or +2 R."]],["expect",["40 % de réussite, gain moyen 2 R, perte moyenne 1 R : espérance +0,2 R.","40% win rate, average win 2 R, average loss 1 R: expectancy +0.2 R."]]],
  p:[["Le ratio risque/gain compare le gain visé au risque : entrée 100, stop 98, objectif 104 donne 1 : 2 (on risque 1 pour viser 2). On mesure alors chaque résultat en multiples de R, le risque pris.","The risk/reward ratio compares the targeted gain to the risk: entry 100, stop 98, target 104 gives 1 : 2 (you risk 1 to aim for 2). Each result is then measured in multiples of R, the risk taken."],
     ["L’espérance combine tout : % de gains × gain moyen − % de pertes × perte moyenne. Avec 40 % de réussite et un gain moyen de 2 R : 0,4 × 2 − 0,6 × 1 = +0,2 R par trade. Un taux de réussite élevé ne suffit pas si le ratio est mauvais.","Expectancy combines everything: win % × average win − loss % × average loss. With a 40% win rate and an average win of 2 R: 0.4 × 2 − 0.6 × 1 = +0.2 R per trade. A high win rate is not enough if the ratio is poor."]],
  take:["Une stratégie gagnante peut perdre sept fois sur dix si ses gains sont assez grands.","A winning strategy can lose seven times out of ten if its wins are big enough."]},
 {id:"l3",t:["Séries de pertes, ruine et frais","Losing streaks, ruin and fees"],imgs:[["ruin",["Dix pertes de 10 % d’affilée laissent environ 35 % du capital.","Ten losses of 10% in a row leave about 35% of the capital."]],["fees",["Deux points de frais par an creusent un grand écart sur 20 ans.","Two points of fees a year open a large gap over 20 years."]]],
  p:[["Même une bonne stratégie connaît des séries de pertes. Avec 10 % de perte par trade, dix pertes d’affilée laissent environ 35 % du capital : risquer peu par trade protège du risque de ruine.","Even a good strategy suffers losing streaks. With a 10% loss per trade, ten losses in a row leave about 35% of capital: risking little per trade protects against ruin."],
     ["Les frais sont certains alors que les gains ne le sont pas : 2 points de frais par an transforment 8 % en 6 %, et 100 deviennent 321 au lieu de 466 en 20 ans. Un journal de trading (raison d’entrée, stop, objectif, résultat en R, émotion) permet de mesurer sa vraie espérance.","Fees are certain while gains are not: 2 points of fees a year turn 8% into 6%, and 100 becomes 321 instead of 466 in 20 years. A trading journal (reason for entry, stop, target, result in R, emotion) lets you measure your true expectancy."]],
  take:["Survivre d’abord : le risque par trade doit pouvoir encaisser une série noire.","Survive first: the risk per trade must be able to absorb a losing streak."]}
 ]},
10:{intro:["Ce dernier niveau rassemble tout : contexte, figure, confirmation, risque et décision. L’objectif n’est pas de prédire, mais de décider de façon cohérente.","This last level brings everything together: context, pattern, confirmation, risk and decision. The goal is not to predict but to decide consistently."],
 lessons:[
 {id:"l1",t:["Construire un plan de trade","Building a trade plan"],imgs:[["plan",["Marteau confirmé : entrée au-dessus de son plus haut, stop sous son plus bas, objectif à deux fois le risque.","Confirmed hammer: entry above its high, stop below its low, target at twice the risk."]]],
  p:[["Un plan écrit avant d’entrer précise : le contexte (tendance de fond, niveau), la figure et sa confirmation, l’entrée, le stop, l’objectif et la taille.","A plan written before entering specifies: the context (underlying trend, level), the pattern and its confirmation, the entry, the stop, the target and the size."],
     ["Exemple : après une baisse, un marteau est confirmé ; on entre au-dessus de son plus haut, le stop se place sous son plus bas, l’objectif vise au moins deux fois le risque, et la taille se calcule sur le risque accepté. Si un élément manque, on n’entre pas.","Example: after a decline, a hammer is confirmed; you enter above its high, the stop goes below its low, the target aims for at least twice the risk, and size is calculated on the accepted risk. If an element is missing, you do not enter."]],
  take:["Un plan transforme une intuition en décision vérifiable.","A plan turns a hunch into a checkable decision."]},
 {id:"l2",t:["Décider après la figure","Deciding after the pattern"],imgs:[["confirm",["Signal confirmé : la bougie suivante clôture au-dessus du corps du marteau.","Confirmed signal: the next candle closes above the hammer’s body."]],["invalid",["Signal invalidé : la bougie suivante clôture sous le plus bas du marteau.","Invalidated signal: the next candle closes below the hammer’s low."]]],
  p:[["La bougie suivante tranche. Si elle confirme, on peut entrer avec son stop et sa taille calculée sur le risque. Si elle invalide, on n’entre pas, et surtout on ne moyenne pas à la baisse sans stop, ni on ne double sa taille pour se rattraper.","The next candle decides. If it confirms, you may enter with your stop and size calculated on the risk. If it invalidates, you do not enter, and above all you do not average down without a stop, nor double your size to recover."],
     ["Une checklist évite d’oublier une étape : tendance de fond, niveau, confirmation, ratio d’au moins 1 : 2, taille conforme au risque, levier effectif raisonnable.","A checklist prevents skipping a step: underlying trend, level, confirmation, a ratio of at least 1 : 2, size matching risk, reasonable effective leverage."]],
  take:["Ne pas entrer est une décision, et souvent la meilleure.","Not entering is a decision, and often the best one."]},
 {id:"l3",t:["Psychologie et validation d’une stratégie","Psychology and validating a strategy"],
  p:[["La peur de rater un mouvement pousse à acheter trop haut, l’aversion aux pertes à garder les perdants, le sur-trading à multiplier les frais, la confiance excessive à grossir ses positions après des gains. Des règles écrites valent mieux que la volonté du moment.","Fear of missing out pushes you to buy too high, loss aversion to hold losers, overtrading to multiply fees, overconfidence to grow positions after gains. Written rules beat willpower in the moment."],
     ["Enfin, un backtest flatte souvent la réalité (frais ignorés, exécutions parfaites, surajustement). Une stratégie doit être testée sur des données qu’elle n’a jamais vues, puis en petite taille. Ces cours sont pédagogiques : ils ne constituent pas un conseil en investissement.","Finally, a backtest often flatters reality (ignored fees, perfect fills, overfitting). A strategy must be tested on data it has never seen, then in small size. These lessons are educational: they are not investment advice."]],
  take:["Ce qu’on ne peut pas prévoir, on le borne : règles écrites, taille limitée, stop respecté.","What you cannot predict, you bound: written rules, limited size, respected stop."]}
 ]}
};

/* ===== Animations (SMIL, boucle) : une bougie qui se forme pendant la période ===== */
const ANIMY=p=>+(196-p*1.8).toFixed(1);
function candleAnim(c,dur){
 /* c : {x, color, path:[prix], labels:[[index du point, fr, en]], name:[fr,en]} */
 const pts=[];const o=c.path[0];
 c.path.forEach((p,i)=>{
  if(i){const a=c.path[i-1];if((a-o)*(p-o)<0)pts.push({p:o,i:i-1+(o-a)/(p-a),x:1});}
  pts.push({p,i});
 });
 const n=c.path.length-1,T=pts.map(q=>.04+.7*q.i/n);
 const kt=["0"].concat(T.map(t=>t.toFixed(3)),["1"]);
 let hi=-1e9,lo=1e9;
 const rows=pts.map(q=>{hi=Math.max(hi,q.p);lo=Math.min(lo,q.p);return{cur:q.p,hi,lo}});
 const first={cur:o,hi:o,lo:o};
 const all=[first].concat(rows,[rows[rows.length-1]]);
 const val=f=>all.map(f).join(";");
 const A=(attr,f)=>`<animate attributeName="${attr}" values="${val(f)}" keyTimes="${kt.join(";")}" dur="${dur}s" repeatCount="indefinite"/>`;
 const fin=rows[rows.length-1];
 const by=r=>ANIMY(Math.max(o,r.cur)),bh=r=>Math.max(1.5,Math.abs(ANIMY(o)-ANIMY(r.cur)));
 let s=`<line x1="${c.x}" x2="${c.x}" y1="${ANIMY(fin.hi)}" y2="${ANIMY(fin.lo)}" stroke="${c.color}" stroke-width="3">${A("y1",r=>ANIMY(r.hi))}${A("y2",r=>ANIMY(r.lo))}</line>`;
 s+=`<rect x="${c.x-18}" width="36" rx="2" fill="${c.color}" y="${by(fin)}" height="${bh(fin)}">${A("y",by)}${A("height",bh)}</rect>`;
 s+=`<circle cx="${c.x}" r="5" fill="var(--ink)" cy="${ANIMY(fin.cur)}">${A("cy",r=>ANIMY(r.cur))}</circle>`;
 c.labels.forEach(([idx,fr,en])=>{
  const k=pts.findIndex(q=>q.i===idx&&!q.x),t=T[k].toFixed(3),y=ANIMY(pts[k].p)+4;
  s+=`<text x="${c.x+26}" y="${y}" style="fill:var(--ink);font-size:11px" opacity="1"><animate attributeName="opacity" values="0;1;1" keyTimes="0;${t};1" calcMode="discrete" dur="${dur}s" repeatCount="indefinite"/>${L(fr,en)}</text>`;
 });
 s+=`<text x="${c.x}" y="218" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:600">${L(c.name[0],c.name[1])}</text>`;
 return s;
}
const mkAnim=(cs,dur)=>()=>`<svg class="canim" viewBox="0 0 520 226" role="img" aria-label="${L("Animation : bougies qui se forment pendant la période","Animation: candles forming during the period")}">${cs.map(c=>candleAnim(c,dur||9)).join("")}</svg>`;
const UPC="var(--up)",DNC="var(--dn)";
const ANIMS={
 anat:{svg:mkAnim([
  {x:70,color:UPC,path:[40,86,24,70],labels:[[0,"Ouverture","Open"],[1,"Plus haut","High"],[2,"Plus bas","Low"],[3,"Clôture","Close"]],name:["Bougie verte","Green candle"]},
  {x:330,color:DNC,path:[70,88,28,40],labels:[[0,"Ouverture","Open"],[1,"Plus haut","High"],[2,"Plus bas","Low"],[3,"Clôture","Close"]],name:["Bougie rouge","Red candle"]}]),
  say:[["Voici une bougie verte. Elle s’ouvre à ce niveau. Le prix monte jusqu’à son plus haut, puis redescend jusqu’à son plus bas, et finit par se fixer : c’est la clôture.","Comme la clôture est au-dessus de l’ouverture, la bougie est verte : les acheteurs ont dominé la période.","Pour la bougie rouge, c’est l’inverse : la clôture est sous l’ouverture, ce sont les vendeurs qui ont dominé."],["Here is a green candle. It opens at this level. Price climbs to its high, then falls back to its low, and finally settles: that is the close.","Since the close is above the open, the candle is green: buyers dominated the period.","For the red candle it is the opposite: the close is below the open, so sellers dominated."]],
  cap:["Une bougie se forme : le prix (point) part de l’ouverture, touche son plus haut et son plus bas, puis s’arrête à la clôture.","A candle forming: the price (dot) starts at the open, touches its high and its low, then stops at the close."]},
 wicks:{svg:mkAnim([
  {x:70,color:UPC,path:[60,66,15,64],labels:[[2,"Les vendeurs poussent…","Sellers push…"],[3,"…les acheteurs reprennent la main","…buyers take control back"]],name:["Marteau","Hammer"]},

/* Chargé après p6.js. Chaque animation tourne en boucle ; la narration vocale est dans `say`. */
const AW=320,AH=190,AMX=8;
const ak=x=>(+x).toFixed(3);
const aShow=(t,D)=>`<animate attributeName="opacity" values="0;1;1" keyTimes="0;${ak(t)};1" calcMode="discrete" dur="${D}s" repeatCount="indefinite"/>`;
const aRt=(x,tOf)=>typeof x==="number"?tOf(x):x==="e"?.76:parseFloat(String(x).slice(1));
function aCaps(steps,D){
 const st=steps.slice().sort((a,b)=>a[0]-b[0]);
 return st.map(([t,fr,en],k)=>{
  const nx=st[k+1]?st[k+1][0]:null,lines=L(fr,en).split("|");
  const kt=nx!==null?`0;${ak(t)};${ak(nx)};1`:`0;${ak(t)};1`,vs=nx!==null?"0;1;0;0":"0;1;1";
  return `<text text-anchor="middle" x="${AW/2}" y="${AH-22}" opacity="${nx!==null?0:1}" style="font-size:11.5px;font-weight:600;fill:var(--ink)">${lines.map((s,i)=>`<tspan x="${AW/2}" dy="${i?14:0}">${s}</tspan>`).join("")}<animate attributeName="opacity" values="${vs}" keyTimes="${kt}" calcMode="discrete" dur="${D}s" repeatCount="indefinite"/></text>`;
 }).join("");
}
const aTitle=t=>t?`<text x="${AMX}" y="13" style="font-size:11px;fill:var(--mute);font-weight:600">${t}</text>`:"";
const aOpen=t=>`<svg class="canim" viewBox="0 0 ${AW} ${AH}" role="img" aria-label="${L("Animation","Animation")}${t?" : "+t:""}">`;

/* bougies qui apparaissent une à une (build() → {cs,from,to}) */
function revealSvg(b,o){
 const D=o.D||10,cs=b.cs,n=cs.length,m=AMX,top=22,H=AH-46,ex=(o.lines||[]).map(l=>l.v);
 const hi=Math.max(...cs.map(c=>c.h),...ex),lo=Math.min(...cs.map(c=>c.l),...ex),pad=(hi-lo)*.08||1;
 const y=v=>top+(hi+pad-v)/(hi-lo+2*pad)*(H-top),st=(AW-2*m)/n,w=st*.6,tOf=i=>.04+.56*i/Math.max(1,n-1);
 const idx=r=>r==="s"?0:r==="e"?n-1:Math.max(0,Math.min(n-1,b.from+r));
 let s=aOpen(o.title)+aTitle(o.title);
 if(b.to>b.from)s+=`<rect x="${m+b.from*st}" y="${top-4}" width="${(b.to-b.from)*st}" height="${H-top+8}" rx="5" style="fill:var(--accbg);stroke:var(--acc)" opacity="1">${aShow(tOf(b.to-1),D)}</rect>`;
 cs.forEach((c,i)=>{const x=m+i*st+st/2,k=c.c>=c.o?"u":"d";
  s+=`<g opacity="1">${aShow(tOf(i),D)}<line class="wk ${k}" x1="${x}" x2="${x}" y1="${y(c.h)}" y2="${y(c.l)}" stroke-width="1.5"/><rect class="bd ${k}" x="${x-w/2}" y="${y(Math.max(c.o,c.c))}" width="${w}" height="${Math.max(1.5,Math.abs(y(c.o)-y(c.c)))}" rx="1"/></g>`});
 (o.lines||[]).forEach(l=>{s+=`<g opacity="1">${aShow(l.at,D)}<line x1="${m}" x2="${AW-m}" y1="${y(l.v)}" y2="${y(l.v)}" stroke-width="1.4" stroke-dasharray="5 3" style="stroke:var(--mute)"/><text x="${m+2}" y="${y(l.v)-4}" style="font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;">${L(l.fr,l.en)}</text></g>`});
 const steps=o.steps.map(([r,fr,en])=>[typeof r==="string"&&r[0]==="f"?parseFloat(r.slice(1)):tOf(idx(r)),fr,en]);
 return s+aCaps(steps,D)+"</svg>";
}

/* courbes tracées progressivement : o.ser=[{v:[...],c,dash}] (même longueur) */
function lineSvg(o){
 const D=o.D||10,m=AMX,top=24,H=AH-50,n=o.ser[0].v.length,Lm=m+4;
 const ex=(o.hl||[]).map(h=>h.v).concat((o.marks||[]).map(k=>o.ser[k.s||0].v[k.i]));
 const all=o.ser.flatMap(s=>s.v).concat(ex),hi=Math.max(...all),lo=Math.min(...all),pad=(hi-lo)*.12||1;
 const X=i=>Lm+i*(AW-Lm-m-4)/(n-1),Y=v=>top+(hi+pad-v)/(hi-lo+2*pad)*(H-top),tOf=i=>.04+.7*i/(n-1);
 let s=aOpen(o.title)+aTitle(o.title);
 (o.hl||[]).forEach(h=>{const yy=Y(h.v).toFixed(1);s+=`<g opacity="1">${h.at!=null?aShow(tOf(h.at),D):""}<line x1="${Lm}" x2="${AW-m}" y1="${yy}" y2="${yy}" stroke-width="1.4" stroke-dasharray="5 3" style="stroke:var(--mute)"/>${h.fr?`<text x="${Lm+2}" y="${(+yy-4).toFixed(1)}" style="font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;">${L(h.fr,h.en)}</text>`:""}</g>`});
 o.ser.forEach(se=>{
  const d=se.v.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  s+=`<path d="${d}" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="0" style="stroke:${se.c||"var(--acc)"}"${se.dash?` stroke-dasharray="0.03 0.02"`:""}><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;.04;.74;1" dur="${D}s" repeatCount="indefinite"/></path>`;
 });
 (o.marks||[]).forEach(k=>{
  const v=o.ser[k.s||0].v[k.i],x=X(k.i),yy=Y(v),right=x>AW*.62,lab=k.fr?L(k.fr,k.en):"";
  s+=`<g opacity="1">${aShow(tOf(k.i),D)}<circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="4" style="fill:var(--ink)"/>${lab?`<text x="${(x+(right?-7:7)).toFixed(1)}" y="${(yy+(k.up===false?16:-8)).toFixed(1)}" text-anchor="${right?"end":"start"}" style="font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;">${lab}</text>`:""}</g>`});
 if(o.xlab)s+=`<text x="${Lm}" y="${AH-36}" style="font-size:10.5px;fill:var(--mute)">${o.xlab[0]}</text><text x="${AW-m}" y="${AH-36}" text-anchor="end" style="font-size:10.5px;fill:var(--mute)">${o.xlab[1]}</text>`;
 const steps=(o.steps||[]).map(([r,fr,en])=>[aRt(r,tOf),fr,en]);
 return s+aCaps(steps,D)+"</svg>";
}

/* barres qui poussent une à une : o.bars=[{v,fr,en,c,top}] */
function barSvg(o){
 const D=o.D||10,k=o.bars.length,y0=136,mh=104,w=(AW-2*AMX)/k,bw=w*.6,mx=o.max||Math.max(...o.bars.map(b=>b.v));

 o.bars.forEach((b,i)=>{

  s+=`<rect x="${x.toFixed(1)}" width="${bw.toFixed(1)}" rx="3" y="${(y0-h).toFixed(1)}" height="${h.toFixed(1)}" style="fill:${col}"><animate attributeName="height" values="0;0;${h.toFixed(1)};${h.toFixed(1)}" keyTimes="0;${ak(t)};${ak(t2)};1" dur="${D}s" repeatCount="indefinite"/><animate attributeName="y" values="${y0};${y0};${(y0-h).toFixed(1)};${(y0-h).toFixed(1)}" keyTimes="0;${ak(t)};${ak(t2)};1" dur="${D}s" repeatCount="indefinite"/></rect>`;
  s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y0-h-5).toFixed(1)}" text-anchor="middle" opacity="1" style="font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;">${aShow(t2+.01,D)}${L(b.top[0],b.top[1])}</text>`;
  s+=`<text x="${(x+bw/2).toFixed(1)}" y="${y0+14}" text-anchor="middle" opacity="1" style="font-size:11px;fill:var(--mute)">${aShow(t,D)}${L(b.fr,b.en)}</text>`;
 });
 const steps=(o.steps||[]).map(([t,fr,en])=>[+t,fr,en]);
 return s+`<line x1="${AMX}" x2="${AW-AMX}" y1="${y0}" y2="${y0}" style="stroke:var(--line)"/>`+aCaps(steps,D)+"</svg>";
}

/* liste qui se coche ligne à ligne : o.rows=[{a:[fr,en],b:[fr,en]}] */
function listSvg(o){
 const D=o.D||12,n=o.rows.length,rh=Math.min(34,(AH-22)/n);
 let s=aOpen(o.title)+aTitle(o.title);
 o.rows.forEach((r,i)=>{const t=.06+.8*i/n,yy=24+i*rh;
  s+=`<g opacity="1">${aShow(t,D)}<text x="${AMX}" y="${yy+11}" style="font-size:12px;font-weight:700;fill:var(--ink)">${L(r.a[0],r.a[1])}</text><text x="${AMX+10}" y="${yy+25}" style="font-size:11px;fill:var(--mute)">→ ${L(r.b[0],r.b[1])}</text></g>`});
 return s+"</svg>";
}
