  cap:["Les points marquent les swing hauts et swing bas qui dessinent la structure.","The dots mark the swing highs and swing lows that draw the structure."],
  say:[["La tendance de fond est la direction dominante malgré les petits replis. On la lit dans sa structure : en hausse, chaque sommet et chaque creux dépasse le précédent.","Les swing hauts et swing bas sont les sommets et creux locaux qui dessinent cette structure."],["The underlying trend is the dominant direction despite small pullbacks. You read it in its structure: in an uptrend, every high and every low exceeds the previous one.","Swing highs and swing lows are the local peaks and troughs that draw this structure."]]},
 n5b:{svg:()=>aWrap([
   lineSvg({title:L("Correction","Pullback"),ser:[{v:[10,11,10.5,12,11.2,13,12.1,14,13,15,14.2,16,15,16.8,15.9,17.5,16.5,17.2,18,19]}],hl:[{v:15.9,fr:"Dernier creux",en:"Last low",at:14}],marks:[{i:16}],steps:[["f0.1","La tendance monte","The trend climbs"],[16,"Le repli reste au-dessus du dernier creux :|simple correction","The pullback stays above the last low:|a simple correction"]]}),
   lineSvg({title:L("Cassure","Breakout"),ser:[{v:[98,101,99,102,98.5,101.5,99,102,100,103.5,106,108,107.2,109.5]}],hl:[{v:102,fr:"Résistance",en:"Resistance",at:1}],marks:[{i:9}],steps:[["f0.1","Le prix bute sur un niveau","Price stalls at a level"],[9,"Clôture au-dessus du niveau :|cassure (à confirmer)","A close above the level:|breakout (to be confirmed)"]]})]),
  cap:["Un repli qui garde le dernier creux est une correction ; une clôture au-delà d’un niveau est une cassure.","A pullback that holds the last low is a correction; a close beyond a level is a breakout."],
  say:[["Un repli qui ne casse pas le dernier creux est une correction : la tendance reste intacte. Si le prix passe sous ce creux, la structure est remise en cause et un retournement devient possible.","Une cassure est crédible avec une clôture au-delà du niveau, mais on ne saura jamais à l’avance si elle tiendra : c’est le risque de fausse cassure."],["A pullback that does not break the last low is a correction: the trend stays intact. If price falls below that low, the structure is in doubt and a reversal becomes possible.","A breakout is credible with a close beyond the level, but you never know in advance whether it will hold: that is the risk of a false breakout."]]},
 n5c:{svg:()=>{const v=detC("up",44);return aWrap([lineSvg({title:L("Prix et moyenne mobile","Price and moving average"),ser:[{v,c:"var(--mute)"},{v:aSMA(v,8),c:"var(--acc)"}],steps:[["f0.12","Gris : le prix. Bleu : sa moyenne mobile","Grey: price. Blue: its moving average"],["f0.64","Le prix reste au-dessus d’une moyenne|qui monte : biais haussier","Price stays above a rising average:|bullish bias"]]})])},
  cap:["La moyenne mobile lisse les clôtures : elle donne la direction, mais avec du retard.","The moving average smooths closes: it gives direction, but with a delay."],
  say:[["Première chose : la moyenne mobile. À chaque bougie, on calcule la moyenne des dernières clôtures. Cela donne une ligne lisse, qui efface le bruit. Si elle monte et que le prix reste au-dessus, le biais est haussier.","Mais attention : elle est calculée avec le passé, donc elle est toujours en retard. Elle confirme une tendance, elle ne l’annonce pas. Et dans un range, elle donne de faux signaux.","Deuxième chose : le volume, c’est la quantité échangée. Un mouvement sur gros volume est plus crédible, car beaucoup de monde y participe.","Troisième chose : l’échelle de temps. Une hausse sur un graphique journalier peut n’être qu’un petit rebond sur un graphique hebdomadaire. Regarde d’abord l’échelle longue, puis affine avec l’échelle courte."],["First thing: the moving average. On each candle, we compute the average of the latest closes. This gives a smooth line that erases the noise. If it rises and price stays above it, the bias is bullish.","But careful: it is computed from the past, so it is always late. It confirms a trend, it does not announce it. And in a range, it gives false signals.","Second thing: volume is the quantity traded. A move on heavy volume is more credible, because many people take part in it.","Third thing: the timeframe. A rise on a daily chart may be just a small rebound on a weekly chart. Look at the long timeframe first, then refine with the short one."]]},
 n6a:{svg:()=>aWrap([barSvg({title:L("Revenir au point de départ","Getting back to the start"),max:100,bars:[{v:100,fr:"Départ",en:"Start",top:["100","100"]},{v:50,fr:"−50 %",en:"−50%",c:"var(--dn)",top:["50","50"]},{v:75,fr:"+50 %",en:"+50%",c:"var(--mute)",top:["75","75"]},{v:100,fr:"+100 %",en:"+100%",top:["100","100"]}],steps:[[.3,"Après −50 %, +50 % ne suffit pas :|on n’est qu’à 75","After −50%, +50% is not enough:|you are only at 75"],[.78,"Il faut +100 % pour revenir à 100","You need +100% to get back to 100"]]})]),
  cap:["Un pourcentage se calcule par rapport au point de départ : une perte demande un gain plus grand pour être effacée.","A percentage is measured against its starting point: a loss needs a larger gain to be erased."],
  say:[["Un pourcentage se calcule toujours par rapport au point de départ du mouvement. Partons de 100. Une baisse de 50 pour cent laisse 50. Une hausse de 50 pour cent depuis 50 ne donne que 75. Il faut une hausse de 100 pour cent pour revenir à 100.","Plus une perte est grande, plus le gain nécessaire pour l’effacer est grand."],["A percentage is always measured against the starting point of the move. Let’s start at 100. A 50 percent fall leaves 50. A 50 percent rise from 50 only gives 75. You need a 100 percent rise to get back to 100.","The bigger a loss, the bigger the gain needed to erase it."]]},
 n6b:{svg:()=>aWrap([
   barSvg({title:L("Composer les variations","Compounding changes"),max:150,bars:[{v:100,fr:"Départ",en:"Start",top:["100","100"]},{v:150,fr:"+50 %",en:"+50%",c:"var(--up)",top:["150","150"]},{v:75,fr:"−50 %",en:"−50%",c:"var(--dn)",top:["75 (−25 %)","75 (−25%)"]}],steps:[[.62,"+50 % puis −50 % ne ramène pas à 100","+50% then −50% does not bring you back to 100"]]}),
   lineSvg({title:L("À 8 % par an, sur 20 ans","At 8% a year, over 20 years"),ser:[{v:aGrid(0,20,1).map(t=>100+8*t),c:"var(--mute)"},{v:aGrid(0,20,1).map(t=>100*Math.pow(1.08,t))}],marks:[{s:1,i:20,fr:"≈ 466",en:"≈ 466",up:false},{s:0,i:20,fr:"260",en:"260"}],steps:[["f0.12","Gris : addition simple. Bleu : intérêts composés","Grey: simple addition. Blue: compound interest"],["f0.8","La composition creuse l’écart","Compounding widens the gap"]]})]),
  cap:["Les pourcentages successifs se multiplient ; la composition fait croître (ou fondre) un capital.","Successive percentages multiply; compounding makes capital grow (or melt)."],
  say:[["Des pourcentages successifs se multiplient, ils ne s’additionnent pas : plus 50 pour cent puis moins 50 pour cent ne ramène pas à 100 mais à 75.","Le même mécanisme fait croître un capital à intérêts composés : à 8 pour cent par an, 100 deviennent environ 466 en vingt ans, contre 260 sans composition."],["Successive percentages multiply, they do not add: plus 50 percent then minus 50 percent does not bring you back to 100 but to 75.","The same mechanism makes capital grow with compound interest: at 8 percent a year, 100 becomes about 466 in twenty years, against 260 without compounding."]]},
 n6c:{svg:()=>aWrap([lineSvg({title:L("Drawdown","Drawdown"),ser:[{v:[100,108,115,125,118,110,102,95,101,108]}],hl:[{v:125,fr:"Sommet 125",en:"Peak 125",at:3},{v:95,fr:"Creux 95",en:"Trough 95",at:7}],marks:[{i:3},{i:7,fr:"Drawdown : −24 %",en:"Drawdown: −24%",up:false}],steps:[["f0.1","Le capital monte jusqu’à un sommet","Capital climbs to a peak"],[7,"Puis il recule jusqu’au creux :|(125 − 95) ÷ 125 = 24 %","Then it falls to the trough:|(125 − 95) ÷ 125 = 24%"]]})]),
  cap:["Le drawdown mesure la baisse entre un sommet et le creux suivant, en pourcentage du sommet.","Drawdown measures the fall from a peak to the next trough, as a percentage of the peak."],
  say:[["Le drawdown mesure la baisse entre un sommet et le creux suivant, en pourcentage du sommet. Ici, de 125 à 95 : moins 24 pour cent.","C’est la mesure du pire moment vécu. Et pour comparer des performances obtenues sur des durées différentes, on les annualise."],["Drawdown measures the fall from a peak to the next trough, as a percentage of the peak. Here, from 125 to 95: minus 24 percent.","It is the measure of the worst moment lived through. And to compare performances over different durations, you annualize them."]]},
 n7a:{svg:()=>{const g=aGrid(-10,10,1);return aWrap([lineSvg({title:L("Résultat selon la variation du prix","Result by price change"),ser:[{v:g.map(x=>x),c:"var(--mute)"},{v:g.map(x=>5*x)}],hl:[{v:0,at:0}],marks:[{s:1,i:20,fr:"×5 : +50 %",en:"×5: +50%"},{s:1,i:0,fr:"×5 : −50 %",en:"×5: −50%",up:true},{s:0,i:20,fr:"×1 : +10 %",en:"×1: +10%",up:false}],xlab:["−10 %","+10 %"],steps:[["f0.12","Gris : sans levier. Bleu : levier ×5","Grey: no leverage. Blue: ×5 leverage"],["f0.8","Gains et pertes sont multipliés par 5","Gains and losses are multiplied by 5"]]})])},
  cap:["Le levier ne crée aucun rendement : il multiplie les deux côtés dans la même proportion.","Leverage creates no return: it multiplies both sides in the same proportion."],
  say:[["Le levier permet de prendre une position plus grande que son capital : l’argent en plus est emprunté au courtier. Le levier, c’est le rapport entre la taille de la position et ton capital. Un levier ×5 veut dire que la position vaut cinq fois ton capital.","Avec un levier ×5, mille euros de capital contrôlent cinq mille euros de position. Le résultat se calcule sur l’exposition : un prix qui varie de plus ou moins 10 pour cent donne plus ou moins 50 pour cent du capital.","Le levier ne crée aucun rendement : il multiplie les gains et les pertes dans la même proportion.","Attention : cet emprunt a un coût. Garder une position à levier d’un jour à l’autre coûte des frais de financement, prélevés chaque nuit sur la somme empruntée, et d’autres frais peuvent s’ajouter selon le courtier."],["Leverage lets you take a position larger than your capital: the extra money is borrowed from the broker. Leverage is the ratio between the size of the position and your capital. ×5 leverage means the position is worth five times your capital.","With ×5 leverage, one thousand euros of capital control five thousand euros of position. The result is computed on exposure: a price move of plus or minus 10 percent gives plus or minus 50 percent of capital.","Leverage creates no return: it multiplies gains and losses in the same proportion.","Careful: this loan has a cost. Holding a leveraged position overnight costs financing fees, charged each night on the borrowed amount, and other fees may apply depending on the broker."]]},
 n7b:{svg:()=>{const g=Array.from({length:21},(_,i)=>-.5*i);return aWrap([lineSvg({title:L("Capital restant à ×10","Capital left at ×10"),ser:[{v:g.map(x=>100+10*x),c:"var(--dn)"}],hl:[{v:50,fr:"Appel de marge (exemple)",en:"Margin call (example)",at:0},{v:0,at:0}],marks:[{i:10},{i:20,fr:"Liquidation",en:"Liquidation",up:true}],xlab:["0 %",L("−10 % sur le prix","−10% on the price")],steps:[["f0.12","Le prix baisse, le capital fond dix fois plus vite","Price falls, capital melts ten times faster"],["f0.8","−10 % sur le prix : capital effacé","−10% on the price: capital wiped out"]]})])},
  cap:["Plus le levier est haut, moins le prix a de marge avant la liquidation (seuil ≈ 100 ÷ levier).","The higher the leverage, the less room price has before liquidation (threshold ≈ 100 ÷ leverage)."],
  say:[["La marge est le capital déposé en garantie. Quand les pertes la grignotent, le courtier peut demander des fonds, c’est l’appel de marge, puis fermer la position d’office : la liquidation.","À levier ×10, une baisse de 10 pour cent du prix suffit à effacer le capital engagé. En pratique, les frais et la marge de maintien rapprochent ce seuil."],["Margin is the capital deposited as collateral. When losses eat into it, the broker may ask for funds, the margin call, then close the position automatically: the liquidation.","At ×10 leverage, a 10 percent fall in price is enough to wipe out the committed capital. In practice, fees and maintenance margin bring this threshold closer."]]},
 n7c:{svg:()=>aWrap([
   lineSvg({title:L("Vente à découvert","Short selling"),ser:[{v:[100,98,96,97,94,92,90,88,85]}],marks:[{i:0,fr:"Vente à 100",en:"Sell at 100",up:true},{i:8,fr:"Rachat à 85 : +15",en:"Buy back at 85: +15",up:true}],steps:[["f0.1","On vend un actif emprunté","You sell a borrowed asset"],[8,"Le prix baisse : on le rachète moins cher","Price falls: you buy it back cheaper"]]}),
   lineSvg({title:L("Un gap saute le stop","A gap jumps the stop"),ser:[{v:[100,99.2,98.4,97.6,92,91.5,91]}],hl:[{v:97,fr:"Stop 97",en:"Stop 97",at:0}],marks:[{i:4,fr:"Exécuté vers 92",en:"Filled near 92",up:false}],steps:[["f0.1","Le prix se rapproche du stop","Price nears the stop"],[4,"Un gap : le stop s’exécute bien plus loin","A gap: the stop fills much further away"]]})]),
  cap:["Un stop limite le risque sans le supprimer, surtout avec un levier élevé.","A stop limits risk without removing it, especially with high leverage."],
  say:[["Vendre à découvert, c’est vendre un actif emprunté pour le racheter moins cher : on gagne si le prix baisse, mais la perte est théoriquement illimitée.","Un stop limite le risque sans le supprimer : lors d’un gap, il peut s’exécuter bien plus loin que prévu. Les positions à levier gardées la nuit paient aussi des frais de financement."],["Short selling means selling a borrowed asset to buy it back cheaper: you gain if the price falls, but the loss is theoretically unlimited.","A stop limits risk without removing it: during a gap, it can fill much further away than planned. Leveraged positions held overnight also pay financing fees."]]},
 n8a:{svg:()=>{const g=aGrid(80,120,2);return aWrap([
   lineSvg({title:L("Acheter un call (strike 100, prime 5)","Buying a call (strike 100, premium 5)"),ser:[{v:g.map(p=>Math.max(p-100,0)-5),c:"var(--up)"}],hl:[{v:0,at:0}],marks:[{i:0,fr:"Perte limitée à la prime",en:"Loss limited to the premium",up:true},{i:20,fr:"Gain : +15 et plus",en:"Gain: +15 and more",up:false}],xlab:["80",L("Prix à l’échéance","Price at expiry")+" → 120"],steps:[["f0.12","Sous le strike, l’option expire sans valeur","Below the strike, the option expires worthless"],["f0.8","Au-dessus, le gain monte avec le prix","Above it, the gain rises with price"]]}),
   lineSvg({title:L("Acheter un put (strike 100, prime 5)","Buying a put (strike 100, premium 5)"),ser:[{v:g.map(p=>Math.max(100-p,0)-5),c:"var(--dn)"}],hl:[{v:0,at:0}],marks:[{i:0,fr:"Gain : +15",en:"Gain: +15",up:false},{i:20,fr:"Perte limitée à la prime",en:"Loss limited to the premium",up:true}],xlab:["80",L("Prix à l’échéance","Price at expiry")+" → 120"],steps:[["f0.12","Le put gagne quand le prix baisse","The put gains when price falls"],["f0.8","Au-dessus du strike, on perd la prime","Above the strike, you lose the premium"]]})])},
  cap:["L’acheteur d’une option perd au plus la prime ; le vendeur encaisse la prime mais s’expose.","The option buyer loses at most the premium; the seller collects the premium but is exposed."],
  say:[["Un call donne le droit d’acheter à un prix fixé, le strike. Si le prix reste sous le strike, tu perds au plus la prime. S’il monte, le gain peut être important.","Un put donne le droit de vendre : il gagne quand le prix baisse, dans la limite du zéro.","L’acheteur d’une option ne perd jamais plus que la prime. Le vendeur, lui, encaisse la prime mais s’expose à une perte élevée."],["A call gives the right to buy at a fixed price, the strike. If price stays below the strike, you lose at most the premium. If it rises, the gain can be large.","A put gives the right to sell: it gains when price falls, down to zero at most.","The option buyer never loses more than the premium. The seller collects the premium but is exposed to a large loss."]]},
 n8b:{svg:()=>aWrap([lineSvg({title:L("Valeur temps d’une option","Time value of an option"),ser:[{v:[8,7.6,7,6.2,5.2,3.9,2.2,0]}],marks:[{i:0,fr:"Beaucoup de temps",en:"Plenty of time",up:false},{i:7,fr:"Échéance : valeur temps = 0",en:"Expiry: time value = 0",up:true}],xlab:[L("Aujourd’hui","Today"),L("Échéance","Expiry")],steps:[["f0.1","La prime = valeur intrinsèque + valeur temps","Premium = intrinsic value + time value"],["f0.6","La valeur temps fond, de plus en plus vite","Time value melts, faster and faster"]]})]),
  cap:["L’acheteur d’option lutte contre le temps : la valeur temps tombe à zéro à l’échéance.","The option buyer fights against time: time value falls to zero at expiry."],
  say:[["Un call est dans la monnaie si le prix est au-dessus du strike, hors de la monnaie s’il est en dessous. La prime se compose de la valeur intrinsèque et de la valeur temps.","La valeur temps fond jusqu’à zéro à l’échéance, et de plus en plus vite à l’approche de celle-ci : l’acheteur d’option lutte contre le temps."],["A call is in the money if price is above the strike, out of the money if below. The premium is made of intrinsic value and time value.","Time value melts to zero at expiry, and faster as it approaches: the option buyer fights against time."]]},
 n8c:{svg:()=>{const g=aGrid(80,120,2);return aWrap([
   lineSvg({title:L("Future ou option ?","Future or option?"),ser:[{v:g.map(p=>p-100),c:"var(--mute)"},{v:g.map(p=>Math.max(p-100,0)-5)}],hl:[{v:0,at:0}],marks:[{s:0,i:0,fr:"Future : −20",en:"Future: −20",up:true},{s:1,i:0,fr:"Call : −5 au plus",en:"Call: −5 at most",up:false}],steps:[["f0.12","Gris : future. Bleu : call acheté","Grey: future. Blue: bought call"],["f0.8","Le future n’a pas de plafond de perte","The future has no cap on the loss"]]}),
   lineSvg({title:L("Action + put : une couverture","Stock + put: a hedge"),ser:[{v:g.map(p=>p-100),c:"var(--mute)"},{v:g.map(p=>(p-100)+Math.max(100-p,0)-5)}],hl:[{v:0,at:0}],marks:[{s:1,i:0,fr:"Plancher : −5 (la prime)",en:"Floor: −5 (the premium)",up:false}],steps:[["f0.12","Gris : l’action seule. Bleu : avec un put","Grey: stock alone. Blue: with a put"],["f0.8","Un plancher, au prix de la prime","A floor, at the cost of the premium"]]})])},
  cap:["Obligation (future) ou droit (option) : la différence est dans la perte maximale.","Obligation (future) or right (option): the difference is in the maximum loss."],
  say:[["Un future est une obligation d’acheter ou de vendre à un prix et une date fixés : son résultat suit le prix dans les deux sens, sans plafond de perte. Une option est un droit : la perte de l’acheteur est limitée à la prime.","Les dérivés servent aussi à se couvrir : posséder une action et acheter un put crée un plancher. Mais se couvrir a un coût : la prime, et donc une partie du rendement."],["A future is an obligation to buy or sell at a fixed price and date: its result follows the price both ways, with no cap on the loss. An option is a right: the buyer’s loss is limited to the premium.","Derivatives are also used to hedge: owning a stock and buying a put creates a floor. But hedging has a cost: the premium, and so part of the return."]]},
 n9a:{svg:()=>aWrap([lineSvg({title:L("Un trade : entrée 100, stop 96, objectif 108","One trade: entry 100, stop 96, target 108"),ser:[{v:[100,101,100,99,97.5,98,99.5,101,103,105,107,108]}],hl:[{v:100,fr:"Entrée",en:"Entry",at:0},{v:96,fr:"Stop",en:"Stop",at:0},{v:108,fr:"Objectif",en:"Target",at:0}],marks:[{i:4},{i:11,fr:"+8",en:"+8",up:false}],steps:[["f0.1","On risque 4 (entrée − stop)","You risk 4 (entry − stop)"],[4,"Le prix s’approche du stop sans l’atteindre","Price nears the stop without hitting it"],[11,"L’objectif est atteint : +8, soit 2 fois le risque","Target reached: +8, twice the risk"]]})]),
  cap:["La taille de position découle du stop : (capital × risque %) ÷ distance au stop.","Position size follows from the stop: (capital × risk %) ÷ distance to the stop."],
  say:[["On décide d’abord du risque accepté sur un trade, par exemple un pour cent du capital. Le stop fixe la distance de risque, et la taille de position s’en déduit : capital fois risque, divisé par la distance au stop.","Ici, entrée à 100, stop à 96, objectif à 108 : on risque 4 pour viser 8. Le stop se place juste au-delà de l’extrême de la figure."],["You first decide the risk accepted on a trade, for example one percent of capital. The stop sets the risk distance, and position size follows: capital times risk, divided by the distance to the stop.","Here, entry at 100, stop at 96, target at 108: you risk 4 to aim for 8. The stop goes just beyond the pattern’s extreme."]]},
 n9b:{svg:()=>aWrap([lineSvg({title:L("Résultat cumulé en R, 10 trades","Cumulative result in R, 10 trades"),ser:[{v:[0,-1,1,0,-1,1,0,2,1,0,2]}],hl:[{v:0,at:0}],marks:[{i:10,fr:"+2 R",en:"+2 R",up:true}],steps:[["f0.1","4 gains de +2 R, 6 pertes de −1 R","4 wins of +2 R, 6 losses of −1 R"],["f0.62","Seulement 40 % de réussite…","Only a 40% win rate…"],["f0.8","…et pourtant +2 R : espérance +0,2 R par trade","…and yet +2 R: expectancy +0.2 R per trade"]]})]),
  cap:["Un taux de réussite élevé ne suffit pas si le ratio est mauvais ; l’espérance combine les deux.","A high win rate is not enough if the ratio is poor; expectancy combines both."],
  say:[["Le ratio risque gain compare le gain visé au risque. On mesure chaque résultat en multiples de R, le risque pris.","Avec quatre gains de plus deux R et six pertes de moins un R, le taux de réussite n’est que de 40 pour cent, et pourtant le résultat est de plus deux R après dix trades : l’espérance est de plus 0,2 R par trade.","Un taux de réussite élevé ne suffit pas si le ratio est mauvais."],["The risk/reward ratio compares the targeted gain to the risk. Each result is measured in multiples of R, the risk taken.","With four wins of plus two R and six losses of minus one R, the win rate is only 40 percent, and yet the result is plus two R after ten trades: expectancy is plus 0.2 R per trade.","A high win rate is not enough if the ratio is poor."]]},
 n9c:{svg:()=>aWrap([
   lineSvg({title:L("10 pertes de 10 % d’affilée","10 losses of 10% in a row"),ser:[{v:aGrid(0,10,1).map(n=>100*Math.pow(.9,n)),c:"var(--dn)"}],marks:[{i:0,fr:"100",en:"100",up:false},{i:10,fr:"≈ 35",en:"≈ 35",up:true}],xlab:[L("Départ","Start"),L("10e perte","10th loss")],steps:[["f0.15","Chaque perte porte sur un capital plus petit","Each loss applies to a smaller capital"],["f0.8","Il reste environ 35 % du capital","About 35% of the capital is left"]]}),
   lineSvg({title:L("Frais de 2 points par an","Fees of 2 points a year"),ser:[{v:aGrid(0,20,1).map(t=>100*Math.pow(1.08,t)),c:"var(--mute)"},{v:aGrid(0,20,1).map(t=>100*Math.pow(1.06,t))}],marks:[{s:0,i:20,fr:"466",en:"466",up:true},{s:1,i:20,fr:"321",en:"321",up:false}],steps:[["f0.12","Gris : 8 % par an. Bleu : 6 % après frais","Grey: 8% a year. Blue: 6% after fees"],["f0.8","L’écart grossit avec le temps","The gap widens over time"]]})]),
  cap:["Survivre d’abord : risquer peu par trade protège du risque de ruine, et les frais pèsent sur la durée.","Survive first: risking little per trade protects against ruin, and fees weigh over time."],
  say:[["Même une bonne stratégie connaît des séries de pertes. Avec dix pour cent de perte par trade, dix pertes d’affilée laissent environ 35 pour cent du capital : risquer peu par trade protège du risque de ruine.","Les frais sont certains alors que les gains ne le sont pas : deux points de frais par an transforment 8 pour cent en 6, et cent deviennent 321 au lieu de 466 en vingt ans."],["Even a good strategy suffers losing streaks. With a 10 percent loss per trade, ten losses in a row leave about 35 percent of capital: risking little per trade protects against ruin.","Fees are certain while gains are not: two points of fees a year turn 8 percent into 6, and 100 becomes 321 instead of 466 in twenty years."]]},
 n10a:{svg:()=>{const b=aHamm("down",E1),pat=b.cs.slice(b.from,b.to),hi=Math.max(...pat.map(x=>x.h)),lo=Math.min(...pat.map(x=>x.l)),T=hi+2*(hi-lo),r=x=>Math.round(x*10)/10;

const PENALTY=7,lvCap=n=>n<NLEV?LEVELS[n+1].cost:LEVELS[NLEV].cost;
function answer(i){

 const st=S.st[q.key]||(S.st[q.key]={s:0,ok:0}),lv=S.lv[q.lv]||(S.lv[q.lv]={s:0,ok:0});
 st.s++;lv.s++;
 S.lp=S.lp||{};
 if(ok){st.ok++;lv.ok++;const gain=Math.max(0,Math.min(q.pts,lvCap(q.lv)-(S.lp[q.lv]||0)));g.delta=gain;g.capped=gain<q.pts;S.cr+=gain;S.earned+=gain;g.earned+=gain;S.lp[q.lv]=(S.lp[q.lv]||0)+gain;g.corr++;g.streak++;S.best=Math.max(S.best,g.streak)}
 else{const loss=Math.min(PENALTY,S.cr);g.delta=-loss;g.capped=false;S.cr-=loss;S.earned-=loss;g.earned-=loss;S.lp[q.lv]=Math.max(0,(S.lp[q.lv]||0)-loss);g.streak=0;(g.miss=g.miss||[]).push({lv:q.lv,key:q.key})}
 g.react=maReact(ok,g.streak);
 save();render(false);
 if(!ok&&TTS&&P.rx)sayExpl(q,true);
}

const SAYS={
marteau:["Le marteau, c’est une petite bougie avec une longue mèche en bas. Pendant la séance, les vendeurs ont fait plonger le prix, mais les acheteurs sont revenus et l’ont ramené près de l’ouverture. Du coup, après une baisse, ça veut dire que les vendeurs s’essoufflent. Mais attention, on attend la bougie suivante pour être sûr.","The hammer is a small candle with a long lower wick. During the session sellers pushed the price down, but buyers came back and pulled it near the open. So after a decline, it means sellers are running out of steam. But careful, we wait for the next candle to be sure."],
inverse:["Le marteau inversé ressemble à l’étoile filante, mais il arrive en bas d’une baisse. Les acheteurs ont essayé de remonter, ils ont été repoussés, mais les vendeurs perdent quand même du terrain. C’est un signal fragile : on attend une bougie verte pour confirmer.","The inverted hammer looks like the shooting star, but it shows up at the bottom of a decline. Buyers tried to push up and were pushed back, yet sellers are still losing ground. It is a fragile signal: wait for a green candle to confirm."],
filante:["L’étoile filante, c’est une longue mèche en haut et un petit corps en bas, après une hausse. Les acheteurs ont poussé très haut, puis les vendeurs ont tout ramené près de l’ouverture, souvent en dessous. L’élan est rejeté. Le petit corps peut être rouge ou vert : le rouge est plus convaincant. Elle compte surtout près d’une résistance, et on la confirme avec une bougie rouge.","The shooting star has a long upper wick and a small body at the bottom, after a rise. Buyers pushed very high, then sellers brought everything back near the open, often below it. The momentum is rejected. The small body can be red or green: red is more convincing. It matters most near a resistance, and a red candle confirms it."],
pendu:["L’homme pendu a exactement la forme du marteau, mais il apparaît après une hausse. C’est le contexte qui change tout. Les vendeurs ont réussi à faire chuter le prix en séance : c’est un premier signe de fragilité. Sans bougie rouge ensuite, la hausse peut très bien continuer.","The hanging man has exactly the hammer’s shape, but it appears after a rise. Context changes everything. Sellers managed to push the price down during the session: a first sign of weakness. Without a red candle afterwards, the rise may well continue."],
doji:["Le doji, c’est une bougie dont l’ouverture et la clôture sont presque identiques. Le prix a bougé, mais il est revenu à son point de départ : acheteurs et vendeurs se neutralisent. Seul, il ne dit pas la direction. C’est la bougie suivante qui tranche.","A doji is a candle whose open and close are almost the same. The price moved but came back to its starting point: buyers and sellers cancel each other out. Alone, it does not tell the direction. The next candle decides."],
libel:["Le doji libellule a la forme d’un T : longue mèche en bas, rien en haut. Les vendeurs ont fait chuter le prix, puis les acheteurs ont tout effacé jusqu’en haut. Après une baisse, ça peut annoncer un rebond, mais il faut une bougie verte ensuite pour le confirmer.","The dragonfly doji is T-shaped: a long lower wick and nothing above. Sellers pushed the price down, then buyers erased it all back to the top. After a decline it may signal a rebound, but you need a green candle afterwards to confirm."],
tombe:["La pierre tombale, c’est l’inverse de la libellule : un T à l’envers. Les acheteurs ont poussé très haut, puis les vendeurs ont tout effacé jusqu’en bas. Après une hausse, ça peut annoncer un retournement, à confirmer avec une bougie rouge.","The gravestone doji is the opposite of the dragonfly: an upside-down T. Buyers pushed very high, then sellers erased it all back to the bottom. After a rise it may signal a reversal, to be confirmed by a red candle."],
maruH:["Le marubozu haussier, c’est une grande bougie verte sans mèche. Les acheteurs ont dominé de l’ouverture à la clôture, sans rien laisser aux vendeurs. C’est une vraie démonstration de force. Mais après une hausse déjà longue, elle peut aussi marquer un excès.","The bullish marubozu is a big green candle with no wicks. Buyers dominated from the open to the close, leaving nothing to sellers. It is a real show of strength. But after an already long rise, it can also mark an excess."],
maruB:["Le marubozu baissier, c’est le contraire : une grande bougie rouge sans mèche. Les vendeurs ont dominé du début à la fin. Après une baisse déjà longue, elle peut marquer un épuisement, alors on regarde toujours la bougie d’après.","The bearish marubozu is the opposite: a big red candle with no wicks. Sellers dominated from start to finish. After an already long decline it can mark exhaustion, so we always look at the next candle."],
toupie:["La toupie a un petit corps avec des mèches des deux côtés. Le prix est allé loin dans les deux sens, puis la séance s’est terminée presque à égalité. Ça montre de l’hésitation, mais pas de direction. C’est très fréquent, donc ça ne dit pas grand-chose sans contexte.","The spinning top has a small body with wicks on both sides. The price went far both ways, then the session ended almost level. It shows hesitation, not direction. It is very common, so it says little without context."],
avH:["L’avalement haussier, c’est une bougie verte dont le corps recouvre entièrement la rouge d’avant. Les acheteurs reprennent d’un coup le contrôle et effacent la séance précédente. Il pèse surtout en bas d’une baisse, sur un support, avec un grand corps.","A bullish engulfing is a green candle whose body fully covers the previous red one. Buyers take back control at once and erase the previous session. It matters most at the bottom of a decline, on a support, with a large body."],
avB:["L’avalement baissier, c’est l’inverse : une bougie rouge qui recouvre entièrement la verte d’avant. Les vendeurs effacent d’un coup le gain de la séance précédente. Il est plus convaincant en haut d’une hausse, sur une résistance.","The bearish engulfing is the reverse: a red candle that fully covers the previous green one. Sellers erase the previous session’s gain at once. It is more convincing at the top of a rise, on a resistance."],
haramiH:["Le harami haussier, c’est une grande bougie rouge suivie d’une petite bougie contenue dans son corps. La baisse perd son élan et le marché hésite. Ce n’est pas un retournement acquis : on attend une bougie verte qui clôture au-dessus de la grande rouge.","The bullish harami is a big red candle followed by a small candle inside its body. The decline loses momentum and the market hesitates. It is not a confirmed reversal: wait for a green candle closing above the big red one."],
haramiB:["Le harami baissier, c’est le miroir : une grande bougie verte, puis une petite contenue dans son corps. La hausse s’essouffle, sans retournement garanti. On attend une bougie rouge qui clôture sous la grande verte.","The bearish harami is the mirror: a big green candle, then a small one inside its body. The rise runs out of steam, with no guaranteed reversal. Wait for a red candle closing below the big green one."],
penet:["La ligne pénétrante, c’est une grande rouge suivie d’une verte qui ouvre plus bas, puis remonte au-delà du milieu de la rouge. Les acheteurs reprennent plus de la moitié du terrain perdu. C’est moins fort qu’un avalement, parce que la verte ne dépasse pas l’ouverture de la rouge.","The piercing line is a big red candle followed by a green one that opens lower, then climbs past the middle of the red body. Buyers win back more than half the lost ground. It is weaker than an engulfing, because the green does not pass the red’s open."],
nuage:["Le nuage noir, c’est une grande verte suivie d’une rouge qui ouvre plus haut, puis redescend sous le milieu de la verte. Les vendeurs reprennent plus de la moitié du terrain gagné. C’est moins puissant qu’un avalement baissier.","The dark cloud cover is a big green candle followed by a red one that opens higher, then falls below the middle of the green. Sellers take back more than half the ground gained. It is weaker than a bearish engulfing."],
pinceB:["Les pinces basses, ce sont deux bougies qui touchent à peu près le même plus bas. Le prix a testé ce niveau deux fois et les vendeurs n’ont pas réussi à passer : un support se dessine. Plus ce niveau est connu, plus la figure compte. Elle est invalidée si le prix casse ce plus bas.","Tweezer bottoms are two candles reaching about the same low. The price tested that level twice and sellers could not break through: a support is forming. The better known the level, the more the pattern counts. It is invalidated if price breaks that low."],
pinceH:["Les pinces hautes, ce sont deux bougies qui touchent à peu près le même plus haut. Le prix a testé ce niveau deux fois et les acheteurs n’ont pas réussi à passer : une résistance se dessine. Elle est invalidée si le prix franchit ce plus haut.","Tweezer tops are two candles reaching about the same high. The price tested that level twice and buyers could not break through: a resistance is forming. It is invalidated if price breaks above that high."],
matin:["L’étoile du matin, ce sont trois bougies : une grande rouge, une petite qui marque une pause, puis une grande verte qui remonte au-delà du milieu de la première. La panique vendeuse s’arrête et les acheteurs prennent le relais. Elle est plus fiable en bas d’une baisse nette.","The morning star is three candles: a big red one, a small one marking a pause, then a big green one climbing past the middle of the first. The selling panic stops and buyers take over. It is more reliable at the bottom of a clear decline."],
soir:["L’étoile du soir, c’est l’inverse : une grande verte, une petite qui marque une pause, puis une grande rouge qui redescend sous le milieu de la première. L’enthousiasme des acheteurs s’arrête et les vendeurs prennent la main. Elle est plus convaincante au contact d’une résistance.","The evening star is the reverse: a big green candle, a small one marking a pause, then a big red one falling below the middle of the first. Buyers’ enthusiasm stops and sellers take over. It is more convincing at a resistance."],
soldats:["Les trois soldats blancs, ce sont trois bougies vertes qui montent d’affilée, chacune ouvrant dans le corps de la précédente. Les acheteurs dominent séance après séance. Attention quand même : après une hausse déjà longue, elle peut marquer un excès plutôt qu’un début.","Three white soldiers are three green candles rising in a row, each opening inside the previous body. Buyers dominate session after session. Careful though: after an already long rise, it may mark an excess rather than a start."],
corbeaux:["Les trois corbeaux noirs, ce sont trois bougies rouges qui descendent d’affilée, chacune ouvrant dans le corps de la précédente. Les vendeurs dominent séance après séance. Après une baisse déjà longue, elle peut marquer un épuisement plutôt qu’un début.","Three black crows are three red candles falling in a row, each opening inside the previous body. Sellers dominate session after session. After an already long decline, it may mark exhaustion rather than a start."],
frappeH:["Les trois lignes de frappe haussières, ce sont trois vertes qui montent, puis une grande rouge qui efface tout. La lecture classique est une poursuite de la hausse : on balaie les acheteurs fragiles et ça repart. Mais les sources ne sont pas d’accord, donc on attend la confirmation.","Three bullish strike lines are three rising green candles, then a big red one that erases everything. The classic reading is a continuation of the rise: fragile buyers are swept out and it resumes. But sources disagree, so we wait for confirmation."],

 const hm=homeMsg();let h=maBlock(hm.mood,hm.text,"",{big:true})+`${noteBox()}<div class="card intro"><p><b>${L("Comment ça marche","How it works")}</b></p><p class="small">${L(`Une session compte ${SESSION} questions. Chaque bonne réponse rapporte des crédits selon le niveau (${LEVELS[1].pts} à ${LEVELS[NLEV].pts}), mais une mauvaise réponse en retire ${PENALTY}. Chaque niveau ne rapporte qu’un nombre limité de crédits (celui qu’il faut pour débloquer le suivant) : pour avancer, il faut progresser de niveau en niveau. Les crédits servent à débloquer le niveau suivant. En niveau N, environ 1 question sur 10 revient d’un niveau inférieur.`,`A session has ${SESSION} questions. Each correct answer earns credits depending on the level (${LEVELS[1].pts} to ${LEVELS[NLEV].pts}), but a wrong answer removes ${PENALTY}. Each level only earns a limited amount of credits (what it takes to unlock the next one): to move forward you have to progress level by level. Credits unlock the next level. In level N, about 1 question in 10 comes from a lower level.`)}</p></div><h2 class="sub" style="margin:14px 0 8px">${L("Partie 1 · Figures de chandeliers (niveaux 1 à 4)","Part 1 · Candlestick patterns (levels 1 to 4)")}</h2><div class="lvs">`;
 for(let n=1;n<=NLEV;n++){
  if(n===5)h+=`</div><h2 class="sub" style="margin:14px 0 8px">${L("Partie 2 · Marchés, levier et risque (niveaux 5 à 10)","Part 2 · Markets, leverage and risk (levels 5 to 10)")}</h2><div class="lvs">`;
  const L_=LEVELS[n],p=pct(S.lv[n]);
  if(n<=U){
   h+=`<section class="card lv"><div><span class="tag haussier">${L("Débloqué","Unlocked")}</span></div><p class="port">${port(n)}</p><h2>${L("Niveau","Level")} ${n} · ${lt(n)}</h2><p class="small mute">${ld(n)}</p><p class="small">${p===null?L("Pas encore joué","Not played yet"):L(`${p} % de réussite (${S.lv[n].ok}/${S.lv[n].s})`,`${p}% correct (${S.lv[n].ok}/${S.lv[n].s})`)}</p><div class="act"><button class="btn" data-play="${n}">${L("Jouer le niveau","Play level")} ${n}</button><button class="btn sec" data-copen="${n}">${L("Lire le cours","Read the course")}</button></div></section>`;
  }else if(n===U+1){
   const miss=Math.max(0,L_.cost-S.cr),w=Math.min(100,Math.round(S.cr/L_.cost*100));
   h+=`<section class="card lv locked"><div><span class="tag gold">${L("À débloquer","To unlock")} · ${L_.cost} ${L("crédits","credits")}</span></div><p class="port">${port(n)}</p><h2>${L("Niveau","Level")} ${n} · ${lt(n)}</h2><p class="small mute">${ld(n)}</p><div class="bar gold" role="img" aria-label="${w} %"><i style="width:${w}%"></i></div><p class="small">${miss?L(`Il manque ${miss} crédits`,`${miss} credits missing`):L("Tu as assez de crédits","You have enough credits")}</p><div class="act"><button class="btn" data-unlock="${n}" ${miss?"disabled":""}>${L("Débloquer","Unlock")} (${L_.cost} ${L("crédits","credits")})</button></div></section>`;
  }else{
   h+=`<section class="card lv locked"><div><span class="tag">${L("Verrouillé","Locked")}</span></div><p class="port">${port(n)}</p><h2>${L("Niveau","Level")} ${n} · ${lt(n)}</h2><p class="small mute">${L(`Débloque d’abord le niveau ${n-1}.`,`Unlock level ${n-1} first.`)}</p></section>`;
  }
 }
 h+=`</div><section class="card lv" style="margin-top:12px"><h2>${L("Mode ALL","ALL mode")}</h2><p class="small mute">${L("Se tester sur tous les niveaux débloqués","Test yourself on every unlocked level")}${U>1?L(` (1 à ${U})`,` (1 to ${U})`):""}${L(", mélangés.",", mixed.")}</p><div class="act"><button class="btn sec" data-play="all" ${U<2?"disabled":""}>${U<2?L("Disponible dès le niveau 2","Available from level 2"):L("Jouer en mode ALL","Play ALL mode")}</button></div></section>`;
 V.innerHTML=h;

function question(){
 const g=G,q=g.cur,done=g.ans!==null,label=g.mode==="all"?L("Mode ALL","ALL mode"):`${L("Niveau","Level")} ${g.mode}`;
 let h=`<div class="card qcard">${TTS?`<div style="text-align:right;margin-bottom:6px"><button class="chip" data-rx="1" role="checkbox" aria-checked="${!P.rx}">${P.rx?"☐":"☑"} ${L("Désactiver les explications vocales","Turn off spoken explanations")}</button></div>`:""}<div class="qhead"><span>${label} · Question ${g.n}/${SESSION}</span><span>${L("Série","Streak")} : ${g.streak} · +${g.earned} ${L("crédits","credits")}</span></div><div class="bar" role="img" aria-label="${L("Progression de la session","Session progress")}"><i style="width:${Math.round((g.n-(done?0:1))/SESSION*100)}%"></i></div>`;
 if(g.mode==="all"||q.lv<+g.mode)h+=`<p style="margin:8px 0 0"><span class="tag">${L("Niveau","Level")} ${q.lv}${q.lv<+g.mode?L(" · rappel"," · review"):""}</span></p>`;
 if(q.chart)h+=q.chart;
 const imgs=q.opts.some(o=>o.img);
 h+=`<p class="qp">${q.prompt}</p><div class="opts${imgs?" imgs":""}">`;
 q.opts.forEach((o,i)=>{
  let c="opt"+(imgs?" img":""),mk="";if(done){if(o.ok){c+=" ok";mk=`<span class="mk">✓</span>`}else if(i===g.ans){c+=" ko";mk=`<span class="mk">✗</span>`}}
  const letter="ABCD"[i];
  h+=imgs
   ?`<button class="${c}" data-a="${i}" aria-label="${L("Graphique","Chart")} ${letter}" ${done?"disabled":""}><span class="letter">${letter}</span>${o.img}${done?`<span class="cap">${mk}${o.cap}</span>`:""}</button>`
   :`<button class="${c}" data-a="${i}" ${done?"disabled":""}>${mk}${o.t}</button>`;
 });
 h+="</div>";
 if(done){
  const ok=q.opts[g.ans].ok,rc=g.react||maReact(ok,g.streak);
  h+=maBlock(rc.mood,rc.text,`<p class="fb">${ok?(g.capped?(g.delta>0?L(`✓ Bonne réponse ! +${g.delta} crédits (plafond du niveau atteint)`,`✓ Correct! +${g.delta} credits (level cap reached)`):L("✓ Bonne réponse ! Plafond de crédits atteint pour ce niveau : pas de crédits en plus. Passe au niveau suivant.","✓ Correct! Credit cap reached for this level: no extra credits. Move on to the next level.")):L(`✓ Bonne réponse ! +${q.pts} crédits`,`✓ Correct! +${q.pts} credits`)):L(`✗ Raté${g.delta?` : ${g.delta} crédits`:""}. La bonne réponse est marquée ✓ et surlignée.`,`✗ Missed${g.delta?`: ${g.delta} credits`:""}. The right answer is marked ✓ and highlighted.`)}</p>`)+`<div class="explain">${q.expl}</div>${TTS?`<div class="vbtns" style="margin-top:8px"><button class="chip" data-xsay="1">${L("🔊 Écouter l’explication","🔊 Listen to the explanation")}</button><button class="chip" data-vpause ${TTSS==="idle"?"hidden":""}>${TTSS==="paused"?L("▶ Reprendre","▶ Resume"):L("⏸ Pause","⏸ Pause")}</button><button class="chip" data-vstop ${TTSS==="idle"?"hidden":""}>${L("⏹ Couper le son","⏹ Stop")}</button></div>`:""}<button class="btn nextb" data-next>${g.n>=SESSION?L("Voir le résultat","See the result"):L("Question suivante","Next question")}</button>`;
 }
 V.innerHTML=h+"</div>";
}
function summary(){
 const g=G,nxt=S.unlocked<NLEV&&S.cr>=LEVELS[S.unlocked+1].cost,v=maVerdict(g);
 V.innerHTML=`<div class="card end"><p class="mute small">${L("Session terminée","Session complete")}</p><div class="big">${g.corr}/${SESSION}</div><p class="vt">${v.title}</p>${maBlock(v.mood,v.text,"",{big:true})}<p>${L(`+${g.earned} crédits gagnés · solde : ${S.cr}`,`+${g.earned} credits earned · balance: ${S.cr}`)}</p>${nxt?`<p class="fb">${L(`Tu peux débloquer le niveau ${S.unlocked+1}.`,`You can unlock level ${S.unlocked+1}.`)}</p>`:""}${v.figs.length?`<div class="fiches"><p class="small mute">${L("Revoir les fiches des points à revoir :","Review the sheets for these points:")}</p><div class="row">${v.figs.map(k=>`<button class="btn sec" data-fiche="${k}">📖 ${fn(FB[k])}</button>`).join("")}</div></div>`:""}<div class="row"><button class="btn" data-play="${g.mode}">${L("Rejouer","Play again")}</button>${v.lvN?`<button class="btn sec" data-copen="${v.lvN}">${L(`Relire le cours du niveau ${v.lvN}`,`Reread the level ${v.lvN} course`)}</button>`:""}<button class="btn sec" data-back>${L("Retour aux niveaux","Back to levels")}</button></div></div>`;
}
function play(){if(!G)home();else if(G.fin)summary();else question()}

ssus de l’ouverture, les acheteurs ont dominé la période. Rouge : c’est l’inverse, les vendeurs ont dominé. Un corps long traduit un mouvement net et décidé, un corps court de l’hésitation.</p></div><div><p><b>La mèche haute (extrémité du haut)</b></p><p>Le trait entre le haut du corps et le plus haut atteint. Elle montre jusqu’où les acheteurs ont poussé avant d’être repoussés par les vendeurs. Longue, elle signale un rejet des prix hauts.</p></div><div><p><b>La mèche basse (extrémité du bas)</b></p><p>Le trait entre le bas du corps et le plus bas atteint. Elle montre jusqu’où les vendeurs ont poussé avant que les acheteurs reprennent la main. Longue, elle signale un rejet des prix bas.</p></div></div><p class="mute small" style="margin-top:8px">Les mèches sont aussi appelées ombres. Dans les illustrations ci-dessous, la zone colorée entoure la figure.</p></section>`;
const ANATEN=`<section class="anat"><h2>Reading a candle</h2><p>Each candle sums up a period (1 minute, 1 hour, 1 day…) with four prices: the open, the close, the high and the low.</p><svg viewBox="0 0 520 214" role="img" aria-label="Anatomy of a green and a red candle: body, upper wick, lower wick"><g style="stroke:var(--up);fill:var(--up)"><line x1="110" x2="110" y1="18" y2="192" stroke-width="3"/><rect x="90" y="60" width="40" height="90" rx="2"/></g><g style="stroke:var(--dn);fill:var(--dn)"><line x1="380" x2="380" y1="18" y2="192" stroke-width="3"/><rect x="360" y="60" width="40" height="90" rx="2"/></g><g class="tm"><line x1="114" x2="138" y1="22" y2="22"/><line x1="130" x2="138" y1="60" y2="60"/><line x1="130" x2="138" y1="150" y2="150"/><line x1="114" x2="138" y1="192" y2="192"/><line x1="384" x2="408" y1="22" y2="22"/><line x1="400" x2="408" y1="60" y2="60"/><line x1="400" x2="408" y1="150" y2="150"/><line x1="384" x2="408" y1="192" y2="192"/></g><text class="t" x="142" y="26">High</text><text class="t" x="142" y="64">Close</text><text class="t" x="142" y="154">Open</text><text class="t" x="142" y="196">Low</text><text class="t" x="412" y="26">High</text><text class="t" x="412" y="64">Open</text><text class="t" x="412" y="154">Close</text><text class="t" x="412" y="196">Low</text><text class="t" x="8" y="43">Upper wick</text><text class="t" x="8" y="109">Body</text><text class="t" x="8" y="175">Lower wick</text><text class="t" x="278" y="43">Upper wick</text><text class="t" x="278" y="109">Body</text><text class="t" x="278" y="175">Lower wick</text><text class="t" x="110" y="211" text-anchor="middle" style="font-weight:600">Green candle (up)</text><text class="t" x="380" y="211" text-anchor="middle" style="font-weight:600">Red candle (down)</text></svg><div class="cols"><div><p><b>The body (central block)</b></p><p>It runs from the open to the close. Green: the close is above the open, buyers dominated the period. Red: the opposite, sellers dominated. A long body shows a clear, decisive move, a short body shows hesitation.</p></div><div><p><b>The upper wick (top end)</b></p><p>The line between the top of the body and the highest price reached. It shows how far buyers pushed before sellers pushed back. When long, it signals a rejection of high prices.</p></div><div><p><b>The lower wick (bottom end)</b></p><p>The line between the bottom of the body and the lowest price reached. It shows how far sellers pushed before buyers took over again. When long, it signals a rejection of low prices.</p></div></div><p class="mute small" style="margin-top:8px">Wicks are also called shadows. In the illustrations below, the colored zone surrounds the pattern.</p></section>`;

function prog(){
 let s=0,ok=0;for(const n in S.lv){s+=S.lv[n].s;ok+=S.lv[n].ok}
 const p=s?Math.round(ok/s*100):0;
 const pm=progMsg(s,p);let h=maBlock(pm.mood,pm.text)+`<div class="card" style="margin-top:12px"><div class="stats"><div><b>${S.cr}</b><span class="mute small">${L("crédits","credits")}</span></div><div><b>${s}</b><span class="mute small">questions</span></div><div><b>${p} %</b><span class="mute small">${L("réussite","success")}</span></div><div><b>${S.best}</b><span class="mute small">${L("meilleure série","best streak")}</span></div><div><b>${S.sessions}</b><span class="mute small">sessions</span></div></div></div>`;
 for(let n=1;n<=NLEV;n++){
  const lp=pct(S.lv[n]);

function pdfFromJpeg(jpg,w,h){
 const te=new TextEncoder(),W=842,H=Math.round(842*h/w),parts=[],off=[];let len=0;
 const add=d=>{const u=typeof d==="string"?te.encode(d):d;parts.push(u);len+=u.length};
 add("%PDF-1.4\n");
 const obj=(n,body)=>{off[n]=len;add(n+" 0 obj\n");add(body);add("\nendobj\n")};
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
 obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
 const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
 obj(4,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
 off[5]=len;add("5 0 obj\n"+`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add("\nendstream\nendobj\n");
 const xr=len;let t="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
 add(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
 const out=new Uint8Array(len);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}

function chooser(){

/* breton : {{mot breton|traduction}} → mot en italique + traduction entre parenthèses (langue du menu) ; la voix lit la traduction, pas le breton */
const bzHtml=s=>s.replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="br" lang="br">$1</span> <span class="tr">($2)</span>');
const bzSpeech=s=>s.replace(/\{\{(.+?)\|(.+?)\}\}/g,"$2");

function maBlock(mood,text,extra,o){
 o=o||{};MA.say=bzSpeech(text);

/* accueil : conseil adapté à la progression */
function homeMsg(){
 const U=S.unlocked;let lowN=0,lowP=101;
 for(let n=1;n<=U;n++){const t=S.lv[n];if(t&&t.s>=5){const p=pct(t);if(p<60&&p<lowP){lowP=p;lowN=n}}}
 if(P.admin)return{mood:"hello",text:L("Mode Admin : tous les ports sont ouverts. Choisis l’escale que tu veux tester.","Admin mode: every port is open. Pick the stop you want to test.")};
 if(!S.sessions&&!Object.keys(S.lv).length)return{mood:"hello",text:L("{{Demat|Bonjour}}, je suis "+MAN()+"\u00a0! Je te guide de port en port. Une session compte 10 questions : chaque bonne réponse rapporte des crédits, et les crédits ouvrent l’escale suivante. Si tu débutes, lis d’abord le cours du niveau 1. "+hum("hi")[0],"{{Demat|Hello}}, I’m "+MAN()+"! I’ll guide you from port to port. A session has 10 questions: each right answer earns credits, and credits open the next stop. If you’re new, read the level 1 course first. "+hum("hi")[1])};
 if(U<NLEV&&S.cr>=LEVELS[U+1].cost)return{mood:"joy",text:L(`{{Mat-tre|Très bien}} ! Tu as assez de crédits : le niveau ${U+1} (${lt(U+1)}) t’attend. Débloque-le quand tu veux.`,`{{Mat-tre|Very good}}! You have enough credits: level ${U+1} (${lt(U+1)}) is waiting. Unlock it whenever you like.`)};
 if(lowN)return{mood:"think",text:L(`Le niveau ${lowN} te résiste (${lowP} % de réussite). Relis son cours, puis rejoue une session : ça paie vite.`,`Level ${lowN} is giving you trouble (${lowP}% correct). Reread its course, then play another session: it pays off fast.`)};
 if(U<NLEV){const miss=LEVELS[U+1].cost-S.cr;return{mood:"hello",text:L(`Il te manque ${miss} crédits pour le niveau ${U+1}. Une session complète du niveau ${U} peut en rapporter jusqu’à ${SESSION*LEVELS[U].pts}.`,`You are ${miss} credits short of level ${U+1}. A full level ${U} session can earn up to ${SESSION*LEVELS[U].pts}.`)}}
 return{mood:"joy",text:L("{{Bravo|Bravo}} ! Tous les ports sont ouverts ! Le mode ALL mélange tous les niveaux : c’est le meilleur test.","{{Bravo|Bravo}}! Every port is open! ALL mode mixes every level: it is the best test.")};
}

function maReact(ok,streak){
 if(ok){
  if(streak>=3)return{mood:"joy",text:L(`Série de ${streak} ! Continue comme ça.`,`Streak of ${streak}! Keep it up.`)};
  const pool=rnd()<.4?hum("ok"):MA_OK,a=pool[Math.floor(rnd()*pool.length)];return{mood:"joy",text:L(a[0],a[1])};
 }
 const pool=rnd()<.4?hum("ko"):MA_KO,a=pool[Math.floor(rnd()*pool.length)];return{mood:"oops",text:L(a[0],a[1])};
}

/* évaluation de fin de session : mention, commentaire, figures à revoir, cours conseillé */
function maVerdict(g){
 const c=g.corr,miss=g.miss||[];
 let title,mood,text;
 if(c>=9){title=L("Excellent","Excellent");mood="joy";text=L("{{Mat-tre|Très bien}} ! Le compte est bon : tu lis les bougies comme un vieux loup de mer lit le ciel.","{{Mat-tre|Very good}}! Spot on: you read candles the way an old sea dog reads the sky.")}
 else if(c>=7){title=L("Bien","Good");mood="joy";text=L("Solide. Quelques détails à polir, mais tu avances bien.","Solid. A few details to polish, but you are making progress.")}
 else if(c>=5){title=L("Correct","Fair");mood="hello";text=L("C’est un début. Regarde ce qui t’a échappé, puis rejoue.","A start. Look at what slipped past you, then play again.")}
 else if(c>=3){title=L("À retravailler","Needs work");mood="oops";text=L("Ça tangue un peu. Un tour par le cours avant de rejouer te fera gagner du temps. {{Chañs vat|Bonne chance}} !","It is a bit choppy. A quick pass through the course before playing again will save you time. {{Chañs vat|Good luck}}!")}
 else{title=L("On reprend le cours","Back to the course");mood="oops";text=L("Mer agitée aujourd’hui. Relis le cours du niveau, puis reviens : tu verras la différence. {{Chañs vat|Bonne chance}} !","Rough seas today. Reread the level’s course, then come back: you will see the difference. {{Chañs vat|Good luck}}!")}
 if(c>=9)text+=" "+L(hum("hiV")[0],hum("hiV")[1]);else if(c<=3)text+=" "+L(hum("loV")[0],hum("loV")[1]);
 const names=[...new Set(miss.map(m=>FB[m.key]?fn(FB[m.key]):null).filter(Boolean))].slice(0,3);
 if(names.length)text+=" "+L("À revoir : ","To review: ")+names.join(", ")+".";
 let lvN=0;
 if(miss.length&&c<7){const cnt={};miss.forEach(m=>{cnt[m.lv]=(cnt[m.lv]||0)+1});let b=0;for(const k in cnt)if(cnt[k]>b){b=cnt[k];lvN=+k}}
 if(lvN>S.unlocked||!COURS[lvN])lvN=0;
 const figs=[...new Set(miss.map(m=>m.key).filter(k=>FB[k]&&FB[k].lv<=S.unlocked))].slice(0,3);
 return{title,mood,text,lvN,figs};
}

/* onglet Progression : bilan général */
function progMsg(s,p){
 if(!s)return{mood:"hello",text:L("Pas encore d’évaluation : joue une session et je te dirai où tu en es.","No assessment yet: play a session and I will tell you where you stand.")};
 let low=0,lp=101;
 for(let n=1;n<=S.unlocked;n++){const t=S.lv[n];if(t&&t.s>=5){const q=pct(t);if(q<lp){lp=q;low=n}}}
 let mood,text;
 if(p>=85){mood="joy";text=L(`Très bon cap : ${p} % de réussite sur ${s} questions.`,`Great heading: ${p}% correct over ${s} questions.`)}
 else if(p>=70){mood="joy";text=L(`Bon rythme : ${p} % de réussite sur ${s} questions.`,`Good pace: ${p}% correct over ${s} questions.`)}
 else if(p>=50){mood="hello";text=L(`Tu progresses : ${p} % de réussite sur ${s} questions. Les cours t’aideront à passer le cap.`,`You are getting there: ${p}% correct over ${s} questions. The courses will help you over the hump.`)}
 else{mood="oops";text=L(`${p} % de réussite sur ${s} questions : il faut consolider. Reprends les cours, un niveau à la fois.`,`${p}% correct over ${s} questions: time to consolidate. Go back to the courses, one level at a time.`)}
 if(low&&lp<85)text+=" "+L(`Ton point faible : le niveau ${low} (${lp} %).`,`Your weak spot: level ${low} (${lp}%).`);
 return{mood,text};
}

 return h+`</section>`;
}
/* fenêtre d'accueil : connexion ou création de compte */
function modalRender(){
 let m=document.getElementById("authm");
 if(!CL.modal||CL.user||!CL.c){if(m)m.remove();try{document.body.style.overflow=""}catch(e){}return}
 try{document.body.style.overflow="hidden"}catch(e){}
 if(!m){m=document.createElement("div");m.id="authm";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-labelledby","authm-t");document.body.appendChild(m)}
 const up=CL.mode==="up";
 m.innerHTML=`<div class="amback"></div><div class="amwrap"><div class="amcard"><button class="amx" data-cloud="later" aria-label="${L("Fermer","Close")}">✕</button><h2 id="authm-t">${L("Bienvenue sur Bigoud Trade","Welcome to Bigoud Trade")}</h2><p class="mute small">${up?L("Crée ton compte pour garder ta progression et la retrouver sur tous tes appareils.","Create your account to keep your progress on all your devices."):L("Connecte‑toi pour retrouver ta progression sur tous tes appareils.","Sign in to find your progress on all your devices.")}</p>${authForm(CL.mode)}<div class="row2"><button class="btn" data-cloud="${up?"up":"in"}" ${CL.busy?"disabled":""}>${up?L("Créer mon compte","Create my account"):L("Me connecter","Sign in")}</button><button class="btn sec" data-cloud="mode" data-to="${up?"in":"up"}">${up?L("J’ai déjà un compte","I already have an account"):L("Créer un compte","Create account")}</button></div>${CL.msg?`<p class="small ${CL.ok?"":"mute"}" role="status">${CL.msg}</p>`:""}${up?privNote():`<div class="row2"><button class="chip" data-cloud="reset" ${CL.busy?"disabled":""}>${L("Mot de passe oublié","Forgot password")}</button></div>`}<div class="row2"><button class="chip" data-cloud="later">${L("Continuer sans compte","Continue without an account")}</button></div></div></div>`;
 const f=m.querySelector("input");if(f&&!m.dataset.f){m.dataset.f="1";try{f.focus()}catch(e){}}
}
const closeModal=()=>{CL.modal=false;try{sessionStorage.setItem("bt-nomodal","1")}catch(e){}modalRender()};
const esc2=x=>x;
document.addEventListener("input",e=>{
 const n=e.target&&e.target.name;if(!e.target.closest||!e.target.closest("[data-acc]"))return;
 if(n==="email")CL.email=e.target.value.trim();else if(n==="pseudo")CL.pseudo=e.target.value;
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&CL.modal)closeModal();
 if(e.key==="Enter"&&e.target&&e.target.closest&&e.target.closest("[data-acc]")){const root=e.target.closest(".amcard")||e.target.closest("section")||document;const b=root.querySelector("button.btn[data-cloud]");if(b)b.click()}
});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-cloud]");if(!b||b.disabled||!CL.c)return;
 const a=b.dataset.cloud,say=(m,ok)=>{CL.msg=m;CL.ok=!!ok;CL.busy=false;render(false);modalRender()};
 if(a==="later"){closeModal();return}
 if(a==="mode"){CL.mode=b.dataset.to==="up"?"up":"in";CL.msg="";render(false);modalRender();return}
 const root=b.closest(".amcard")||b.closest("section")||document,val=n=>{const el=root.querySelector('[name="'+n+'"]');return el?el.value:""};
 const em=(val("email")||CL.email||"").trim(),pw=val("pw"),ps=(val("pseudo")||"").trim();CL.email=em;if(ps)CL.pseudo=ps;
 try{
  if(a==="in"||a==="up"){
   if(!em||!pw)return say(L("Saisis ton e‑mail et ton mot de passe.","Enter your email and password."));
   if(a==="up"){
    if(!pseudoOk(ps))return say(L("Choisis un pseudo de 2 à 20 caractères (lettres, chiffres, espace, tiret).","Choose a nickname of 2–20 characters (letters, digits, space, hyphen)."));
    if(pw.length<8)return say(L("Le mot de passe doit faire au moins 8 caractères.","The password must be at least 8 characters."));
   }
   CL.busy=true;CL.msg=L("Un instant…","One moment…");render(false);modalRender();
   if(a==="in"){const{error}=await CL.c.auth.signInWithPassword({email:em,password:pw});if(error)return say(L("Connexion impossible : vérifie ton e‑mail et ton mot de passe (et que ton adresse est confirmée).","Sign-in failed: check your email and password (and that your address is confirmed)."));CL.busy=false}
   else{const{data,error}=await CL.c.auth.signUp({email:em,password:pw,options:{data:{pseudo:ps},emailRedirectTo:location.href.split("#")[0]}});if(error)return say(L("Création impossible : ","Could not create the account: ")+error.message);if(!data.session)return say(L("Compte créé. Ouvre le lien reçu par e‑mail pour le confirmer, puis connecte‑toi.","Account created. Open the link sent by email to confirm it, then sign in."),true);CL.busy=false}
  }else if(a==="setpseudo"){
   if(!pseudoOk(ps))return say(L("Choisis un pseudo de 2 à 20 caractères (lettres, chiffres, espace, tiret).","Choose a nickname of 2–20 characters (letters, digits, space, hyphen)."));
   const{data,error}=await CL.c.auth.updateUser({data:{pseudo:ps}});
   if(error)return say(L("Enregistrement impossible pour le moment.","Could not save right now."));
   if(data&&data.user)CL.user=data.user;say(L("Pseudo enregistré.","Nickname saved."),true);
  }else if(a==="reset"){
   if(!em)return say(L("Saisis d’abord ton e‑mail.","Enter your email first."));
   const{error}=await CL.c.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]});
   say(error?L("Envoi impossible pour le moment.","Could not send right now."):L("Si cette adresse a un compte, un e‑mail de réinitialisation vient d’être envoyé.","If this address has an account, a reset email has just been sent."),!error);
  }else if(a==="out"){await CL.c.auth.signOut();CL.user=null;CL.pulled=false;say(L("Tu es déconnecté.","You are signed out."),true)}
  else if(a==="del"){CL.del=true;render(false)}
  else if(a==="delno"){CL.del=false;render(false)}
  else if(a==="delgo"){const{error}=await CL.c.rpc("delete_my_account");CL.del=false;if(error)return say(L("Suppression impossible pour le moment.","Could not delete right now."));try{await CL.c.auth.signOut()}catch(e){}CL.user=null;CL.pulled=false;say(L("Ton compte et ta progression en ligne ont été supprimés.","Your account and online progress were deleted."),true)}
 }catch(err){say(L("Une erreur est survenue. Réessaie dans un instant.","Something went wrong. Try again in a moment."))}
});
/* ouverture : fenêtre de connexion si personne n'est connecté */
if(CL.c){
 CL.c.auth.getSession().then(({data})=>{
  if(data&&data.session)return;
  let seen=false;try{seen=sessionStorage.getItem("bt-nomodal")==="1"}catch(e){}
  if(!seen&&!CL.user){CL.modal=true;modalRender()}
 }).catch(()=>{});
}

/* les personnages sont affichés comme des images : certains navigateurs recolorent les dessins en ligne en mode sombre forcé, pas les images */
(function(){
 const SEL=".mav svg,#logo svg";
 function toImg(svg){
  try{
   if(!svg.parentNode)return;
   let src=svg.outerHTML;
   if(!/^<svg[^>]*xmlns=/.test(src))src=src.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"');
   const img=new Image();img.alt=svg.getAttribute("aria-label")||"";img.decoding="async";img.draggable=false;
   img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
   svg.replaceWith(img);
  }catch(e){}
 }
 const run=root=>{try{root.querySelectorAll(SEL).forEach(toImg)}catch(e){}};
 try{new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches(SEL))toImg(n);else run(n)}))}).observe(document.body,{childList:true,subtree:true})}catch(e){}
 run(document);
})();
render(false);
</script>
