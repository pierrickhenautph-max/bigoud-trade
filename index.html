<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A1524">
<title>Choisis ton module</title>
<meta name="description" content="Entraîne-toi pas à pas : choisis ton module d'entraînement.">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* Retours de paiement et liens e-mail (confirmation, mot de passe) : ils arrivaient à la racine avant le déplacement de Trade dans /trade/, on les y renvoie avec leurs paramètres */
(function(){var s=location.search,h=location.hash;if(s||(h&&h.length>1)){location.replace("trade/"+s+h)}})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#ECF1F6;--card:#fff;--ink:#0E2342;--mute:#566780;--line:#CDD7E3;--acc:#16396E;--onacc:#fff;--accbg:rgba(22,57,110,.10);--up:#12906a;--dn:#d3443c;
 --f-head:"Bricolage Grotesque","Inter",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0A1524;--card:#112239;--ink:#E8EEF6;--mute:#9AABC0;--line:#243852;--acc:#F2C23A;--onacc:#0A1524;--accbg:rgba(242,194,58,.14);--up:#2fcf9b;--dn:#ff6e66}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 .75rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
h1{font:800 clamp(1.7rem,5vw,2.4rem)/1.1 var(--f-head);margin:0 0 10px;text-wrap:balance}
.lead{margin:0 0 28px;color:var(--mute);max-width:46ch;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none}
.card h2{font:700 1.25rem/1.2 var(--f-head);margin:0}
.card p{margin:0;color:var(--mute);font-size:.95rem}
.ico{width:56px;height:56px;border-radius:14px;background:var(--accbg);display:grid;place-items:center;color:var(--acc);font:800 .95rem/1 var(--f-head)}
.ico.off{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.tag{align-self:flex-start;font:600 .72rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px}
.tag.on{background:var(--accbg);color:var(--acc)}
.tag.soon{border:1px solid var(--line);color:var(--mute)}
a.card.live{border:1.5px solid var(--acc);transition:transform .15s,box-shadow .15s}
a.card.live:hover,a.card.live:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.14);outline:none}
a.card.live:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.go{margin-top:auto;padding-top:6px;font-weight:600;color:var(--acc)}
.card.soon{opacity:.72}
.note{margin:26px 0 0;font-size:.85rem;color:var(--mute);max-width:60ch}
@media (prefers-reduced-motion:reduce){a.card.live{transition:none}a.card.live:hover{transform:none}}
</style></head>
<body>
<div class="wrap">
 <p class="eyebrow" id="eyebrow"></p>
 <h1 id="h1"></h1>
 <p class="lead" id="lead"></p>
 <div class="grid">
  <a class="card live" href="trade/">
   <div class="ico" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
     <path d="M7 5v24M17 9v20M27 4v22"/>
     <rect x="4" y="11" width="6" height="11" rx="1.5" fill="currentColor" stroke="none" opacity=".35"/>
     <rect x="14" y="14" width="6" height="9" rx="1.5" fill="currentColor" stroke="none"/>
     <rect x="24" y="8" width="6" height="13" rx="1.5" fill="currentColor" stroke="none" opacity=".35"/>
    </svg>
   </div>
   <span class="tag on" id="t-on"></span>
   <h2>Trade</h2>
   <p id="d-trade"></p>
   <span class="go" id="go"></span>
  </a>
  <div class="card soon" aria-disabled="true">
   <div class="ico off" aria-hidden="true">Doc</div>
   <span class="tag soon" id="t-doc"></span>
   <h2>Doc</h2>
   <p id="d-doc"></p>
  </div>
  <div class="card soon" aria-disabled="true">
   <div class="ico off" aria-hidden="true">Stu</div>
   <span class="tag soon" id="t-stu"></span>
   <h2>Student</h2>
   <p id="d-stu"></p>
  </div>
 </div>
 <p class="note" id="note"></p>
</div>
<script>
(function(){
var en=/^en/i.test(navigator.language||"");
var T=en?{
 eyebrow:"Training",h1:"Choose your module",lead:"One account, one place. Pick where you want to practise.",
 on:"Available",soon:"Coming soon",go:"Open Trade →",
 trade:"Learn to read Japanese candlesticks, percentages and leverage. Levels 1 to 4 are free.",
 doc:"A new module is on its way.",stu:"A new module is on its way.",
 note:"Educational content only. Nothing here is investment advice, and past patterns do not guarantee future results.",title:"Choose your module"
}:{
 eyebrow:"Entraînement",h1:"Choisis ton module",lead:"Un seul compte, un seul endroit. Choisis ce que tu veux travailler.",
 on:"Disponible",soon:"Bientôt",go:"Ouvrir Trade →",
 trade:"Apprends à lire les bougies japonaises, les pourcentages et le levier. Les niveaux 1 à 4 sont gratuits.",
 doc:"Un nouveau module est en préparation.",stu:"Un nouveau module est en préparation.",
 note:"Contenu éducatif uniquement. Rien ici n'est un conseil en investissement, et les figures passées ne garantissent pas les résultats futurs.",title:"Choisis ton module"
};
function set(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
document.documentElement.lang=en?"en":"fr";document.title=T.title;
set("eyebrow",T.eyebrow);set("h1",T.h1);set("lead",T.lead);set("t-on",T.on);set("t-doc",T.soon);set("t-stu",T.soon);
set("go",T.go);set("d-trade",T.trade);set("d-doc",T.doc);set("d-stu",T.stu);set("note",T.note);
})();
</script>
</body></html>
